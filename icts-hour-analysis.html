<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Only SheetJS and the font may load from the network. connect-src 'none' blocks
     fetch/XHR/beacons and img-src blocks image requests, so data cannot leave the tab. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>ICTS Employee Hour Analysis</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;550;600;650;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ---------- tokens ---------- */
:root {
  /* ICTS brand, taken from the logo */
  --brand: #14325F; --brand-2: #234C8C; --brand-red: #C11E26; --brand-soft: #E5EBF5;
  --bg: #EEF1F6; --surface: #FFFFFF; --surface-2: #F5F7FB; --sunk: #E5E9F1;
  --ink: #0F1E3A; --ink-2: #3D4B65; --muted: #69778F; --line: #D9DFEA; --line-2: #B8C3D5;
  /* “state” marker (month in focus, selected, read files): brand navy */
  --amber: #14325F; --amber-ink: #FFFFFF; --amber-soft: #E4EAF5; --amber-line: #14325F;
  --as: #2E62B9; --as-soft: #DFE8F8; --bx: #0D8474; --bx-soft: #D3EEEA;
  --ok: #22804A; --warn: #A15C00; --warn-soft: #FFF1DC; --bad: #B4231B; --bad-soft: #FBE4E1;
  --focus: #234C8C;
  --c1: #2E62B9; --c2: #E0662A; --c3: #22804A; --c4: #8E44AD; --c5: #C11E26; --c6: #0B7A8C;
  --r-s: 5px; --r-m: 10px;
  --shadow: 0 1px 2px rgba(15, 30, 58, .06), 0 1px 1px rgba(15, 30, 58, .03);
  --f: 'Commissioner', 'Segoe UI', 'Noto Sans', system-ui, -apple-system, sans-serif;
  --pad: clamp(14px, 1.8vw, 36px);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --brand: #7FA3E0; --brand-2: #9DB9EA; --brand-red: #E4474F; --brand-soft: #1A2C4E;
  --bg: #0A1322; --surface: #101C31; --surface-2: #15233C; --sunk: #081020;
  --ink: #E6ECF6; --ink-2: #B2BED3; --muted: #8190A8; --line: #213150; --line-2: #33466B;
  --amber: #3B64AE; --amber-ink: #FFFFFF; --amber-soft: #19294A; --amber-line: #5D86D2;
  --as: #7FA6EE; --as-soft: #1C2F52; --bx: #43C3B1; --bx-soft: #103A34;
  --ok: #62C38D; --warn: #E5A83E; --warn-soft: #3A2C12; --bad: #EE7F72; --bad-soft: #3C1D1B;
  --focus: #9DB9EA;
  --c1: #8CA9F2; --c2: #FF9A5C; --c3: #69C97A; --c4: #CC8BEA; --c5: #FF7B7B; --c6: #4FC3D6;
  --shadow: none;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: 15px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); line-height: 1.45;
       font-feature-settings: "tnum" 1, "lnum" 1; font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; line-height: 1.2; }
h3 { font-size: 1rem; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.muted { color: var(--muted); }
.small { font-size: 0.867rem; }
.num { text-align: right; white-space: nowrap; }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: .45em; padding: .5rem .9rem; border-radius: var(--r-s);
       border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 550; white-space: nowrap; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary:hover, .btn.danger-fill:hover { color: #fff; }
.btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn.primary:hover { background: var(--brand-2); border-color: var(--brand-2); }
:root[data-theme="dark"] .btn.primary { background: var(--amber); border-color: var(--amber); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--line); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); }
.btn.sm { padding: .3rem .6rem; font-size: .867rem; }
.btn:disabled { opacity: .5; cursor: default; }
.icon { width: 1.05em; height: 1.05em; flex: none; }

/* ---------- upload screen ---------- */
.up { max-width: 1680px; margin: 0 auto; padding: 36px var(--pad) 56px; }
.up-top .brand-mark { height: 84px; padding: 4px 8px; }
.up h1 { color: var(--brand); }
:root[data-theme="dark"] .up h1 { color: var(--ink); }
body:not(.in-app) { border-top: 3px solid var(--brand-red); }
.up-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 44px; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 650; }
.brand-mark { height: 50px; min-width: 40px; border-radius: 6px; background: var(--brand); color: #fff; flex: none;
              display: flex; align-items: center; justify-content: center; font-size: .78rem; font-weight: 700; letter-spacing: .02em; overflow: hidden; }
.brand-mark.has-logo { background: #fff; padding: 2px 4px; }
.brand-mark img { height: 46px; width: auto; display: block; }
.up-top .brand-mark img { height: 76px; }
:root[data-theme="dark"] .brand-mark.has-logo { box-shadow: 0 0 0 1px var(--line-2); }
.up-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: clamp(32px, 4vw, 80px); align-items: start; }
.up h1 { font-size: 2.6rem; line-height: 1.08; letter-spacing: -0.025em; font-weight: 700; max-width: 14ch; }
.lede { margin-top: 14px; color: var(--ink-2); font-size: 1.07rem; max-width: 46ch; }
.year-row { display: flex; align-items: center; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
.year-row label { font-weight: 600; }
.year-row input { width: 6.5rem; padding: .45rem .6rem; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); font-weight: 600; }
.year-row .muted { flex-basis: 100%; font-size: .867rem; }
.drop { margin-top: 22px; border: 1.5px dashed var(--line-2); border-radius: var(--r-m); background: var(--surface);
        padding: 26px 24px; display: grid; gap: 14px; }
.drop.over, body.dragging .drop { border-color: var(--amber-line); background: var(--amber-soft); }
.drop strong { font-size: 1.1rem; }
.drop p { color: var(--ink-2); max-width: 52ch; }
.drop-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.privacy { margin-top: 18px; display: flex; gap: 10px; color: var(--ink-2); font-size: .9rem; max-width: 56ch; }
.privacy .icon { margin-top: 2px; color: var(--ok); }
.lib-error { margin-top: 18px; padding: 12px 14px; border-radius: var(--r-s); background: var(--bad-soft); color: var(--bad); }

/* ---------- coverage board (the one memorable element) ---------- */
.board { container-type: inline-size; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 22px 22px 18px; }
.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.board-head h3 { font-size: 1.05rem; }
.cov { display: grid; grid-template-columns: 34px repeat(12, minmax(0, 1fr)); gap: 4px; }
.cov .lab { display: flex; align-items: center; font-weight: 650; font-size: .9rem; }
.cov .lab::before { content: ''; width: 3px; height: 70%; border-radius: 2px; margin-right: 7px; background: currentColor; }
.cov .lab.as { color: var(--as); } .cov .lab.bx { color: var(--bx); }
.cov .mh { font-size: .75rem; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cov .mh .l { display: none; }
.cell { aspect-ratio: 1 / 1.08; border-radius: 3px; border: 1px solid var(--line); background: var(--surface-2);
        display: flex; flex-direction: column; justify-content: flex-end; padding: 3px 4px; min-width: 0; position: relative; }
.cell .n { font-size: .7rem; line-height: 1; color: var(--muted); overflow: hidden; }
.cell.ok { background: var(--amber); border-color: var(--amber-line); }
.cell.ok .n { color: var(--amber-ink); font-weight: 650; }
.cell.warn { background: repeating-linear-gradient(135deg, var(--amber) 0 5px, var(--amber-soft) 5px 10px); border-color: var(--amber-line); }
.cell.warn .n { color: var(--amber-ink); font-weight: 650; background: var(--amber); border-radius: 2px; padding: 1px 2px; align-self: flex-start; }
.cell.gap { background: var(--bad-soft); border: 1.5px dashed var(--bad); }
.cell.future { background: transparent; border-style: dotted; opacity: .55; }
.cell.new { animation: flip .5s ease-out; }
@keyframes flip { from { transform: rotateX(90deg); } to { transform: none; } }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.slot { border: 1px solid var(--line); border-radius: 3px; background: var(--surface-2); padding: 9px 11px; min-width: 0; }
.slot b { display: block; font-size: .9rem; font-weight: 600; }
.slot span { font-size: .8rem; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.ok { background: var(--amber); border-color: var(--amber-line); }
.slot.ok b, .slot.ok span { color: var(--amber-ink); }
.slot.req { border: 1.5px dashed var(--line-2); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--line); }
.legend .ok { background: var(--amber); border-color: var(--amber-line); }
.legend .warn { background: repeating-linear-gradient(135deg, var(--amber) 0 3px, var(--amber-soft) 3px 6px); border-color: var(--amber-line); }
.legend .gap { background: var(--bad-soft); border: 1px dashed var(--bad); }

@container (max-width: 470px) {
  .cov { grid-template-columns: 28px repeat(12, minmax(0, 1fr)); gap: 3px; }
  .cov .mh .s { display: none; } .cov .mh .l { display: inline; }
  .cell { aspect-ratio: 1 / 1.25; }
  .cell .n { display: none; }
  .slots { grid-template-columns: 1fr; }
}

/* ---------- app shell ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-top: 3px solid var(--brand-red); box-shadow: 0 1px 0 var(--line); }
.bar-in { padding: 8px var(--pad); display: flex; align-items: center; gap: 22px; }
.bar .brand { margin-right: 4px; gap: 14px; }
.bar .brand-name { display: flex; flex-direction: column; line-height: 1.15; padding-left: 14px; border-left: 1px solid var(--line-2); color: var(--brand); font-size: 1.02rem; }
.bar .brand-name small { font-weight: 500; color: var(--muted); font-size: .8rem; }
.tabs { display: flex; gap: 2px; flex: 1; overflow-x: auto; scrollbar-width: none; align-self: stretch; align-items: stretch; }
.tab { padding: 0 .9rem; border: 0; background: none; cursor: pointer; color: var(--ink-2); font-weight: 600; white-space: nowrap; position: relative; display: flex; align-items: center; border-radius: 0; }
.tab:hover { color: var(--brand); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--brand); }
.tab[aria-selected="true"]::after { content: ''; position: absolute; left: .7rem; right: .7rem; bottom: -8px; height: 3px; background: var(--brand-red); border-radius: 2px 2px 0 0; }
.bar-actions { display: flex; gap: 6px; align-items: center; }
main { padding: 24px var(--pad) 64px; }

/* ---------- files view ---------- */
.view-head h2 { color: var(--brand); font-size: 1.5rem; }
:root[data-theme="dark"] .view-head h2 { color: var(--ink); }
.view-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
.view-head p { color: var(--ink-2); margin-top: 6px; max-width: 70ch; }
.files-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); box-shadow: var(--shadow); }
.panel-h h3 { color: var(--brand); }
:root[data-theme="dark"] .panel-h h3 { color: var(--ink); }
.panel-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.panel-b { padding: 16px 18px; }
.stack { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }

.tbl-wrap { overflow-x: auto; position: relative; }
table.t { border-collapse: collapse; width: 100%; font-size: .933rem; }
.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: .8rem; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.t td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t tbody tr:last-child td { border-bottom: 0; }
.t tr.sep td { border-top: 1px solid var(--line-2); }
.t .fname { font-weight: 550; overflow-wrap: anywhere; min-width: 12ch; }
.t tr.dim td { color: var(--muted); }
.t tr.dim .fname { text-decoration: line-through; }
.co { display: inline-block; font-weight: 650; font-size: .8rem; padding: 1px 6px; border-radius: 3px; margin-right: 6px; }
.co.as { color: var(--as); background: var(--as-soft); } .co.bx { color: var(--bx); background: var(--bx-soft); }
.co.hr, .co.mp { color: var(--ink-2); background: var(--sunk); }
.chk { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; white-space: nowrap; }
.chk.ok { color: var(--ok); } .chk.warn { color: var(--warn); } .chk.bad { color: var(--bad); } .chk.none { color: var(--muted); font-weight: 500; }

.notes { display: grid; gap: 8px; }
.note { display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--r-s); background: var(--surface-2); border-left: 3px solid var(--line-2); font-size: .933rem; }
.note .icon { margin-top: 2px; }
.note.warn { background: var(--warn-soft); border-left-color: var(--warn); } .note.warn .icon { color: var(--warn); }
.note.bad { background: var(--bad-soft); border-left-color: var(--bad); } .note.bad .icon { color: var(--bad); }
.note.info .icon { color: var(--muted); }

.pending-group { display: grid; gap: 10px; }
.pending-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.pending-head p { color: var(--ink-2); max-width: 60ch; }
.pending { display: grid; gap: 10px; padding: 14px 16px; border: 1.5px solid var(--amber-line); background: var(--amber-soft); border-radius: var(--r-m); }
.pending-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pending select { padding: .4rem .5rem; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); }

dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: .933rem; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; text-align: right; font-weight: 550; }
.sub-h { font-size: .867rem; color: var(--muted); font-weight: 600; margin: 14px 0 8px; }
.sub-h:first-child { margin-top: 0; }

/* ---------- clear-all confirmation ---------- */
.clear-wrap { position: relative; }
.confirm { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 290px; padding: 14px 16px; display: grid; gap: 8px;
           background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-m); box-shadow: 0 8px 24px rgba(10, 20, 30, .18); }
.confirm-actions { display: flex; gap: 8px; margin-top: 4px; }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-fill:hover { background: var(--bad); filter: brightness(1.08); }

/* ---------- progress ---------- */
.progress { padding: 22px; }
.steps { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.step { flex: 1; min-width: 110px; padding: 8px 10px; border-radius: var(--r-s); background: var(--surface-2); color: var(--muted); font-size: .867rem; font-weight: 550; border: 1px solid var(--line); }
.step.done { color: var(--ink-2); }
.step.done::before { content: '✓ '; color: var(--ok); }
.step.now { background: var(--amber-soft); color: var(--ink); border-color: var(--amber-line); }
.meter { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--amber); width: 0; transition: width .2s; }
.progress .cur { margin-top: 10px; font-size: .867rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- drop overlay ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: color-mix(in srgb, var(--bg) 80%, transparent); }
body.dragging.in-app .overlay { display: grid; }
.overlay div { padding: 28px 40px; border: 2px dashed var(--amber-line); background: var(--amber-soft); border-radius: var(--r-m); font-weight: 650; font-size: 1.15rem; }

/* ---------- filter bar: navy strip, like the logo's frame ---------- */
.filters { background: var(--brand); }
:root[data-theme="dark"] .filters { background: #0E2143; border-bottom: 1px solid var(--line); }
.filters-in { padding: 9px var(--pad) 11px; display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.fg { display: grid; gap: 3px; min-width: 0; }
.fg.grow { flex: 1 1 240px; max-width: 520px; }
.fl { font-size: .75rem; color: var(--muted); font-weight: 600; }
.filters .fl { color: rgba(255, 255, 255, .72); }
.fg select, .fg input, .list-search input, .adder input, .adder select {
  padding: .4rem .6rem; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); min-width: 0; }
.filters .fg select, .filters .fg input { border-color: transparent; background: #fff; color: #0F1E3A; }
:root[data-theme="dark"] .filters .fg select, :root[data-theme="dark"] .filters .fg input { background: var(--surface); color: var(--ink); border-color: var(--line-2); }
.fg select { max-width: 240px; }
.fg input { width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-s); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: .4rem .75rem; cursor: pointer; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--amber); }
.filters .seg { background: transparent; border-color: rgba(255, 255, 255, .35); }
.filters .seg button { color: rgba(255, 255, 255, .88); }
.filters .seg button + button { border-left-color: rgba(255, 255, 255, .35); }
.filters .seg button[aria-pressed="true"] { background: #fff; color: #14325F; }
.filters .btn { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .45); }
.filters .btn:hover:not(:disabled) { background: rgba(255, 255, 255, .12); border-color: #fff; }
.seg.wide { display: flex; } .seg.wide button { flex: 1; }
.tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: 6px; vertical-align: 2px; }

/* ---------- shared bits ---------- */
.person { display: grid; gap: 2px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; min-width: 0; }
.person .pn { font-weight: 600; }
.person:hover .pn { text-decoration: underline; text-underline-offset: 2px; }
.pc { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.code { font-size: .75rem; font-weight: 600; padding: 0 5px; border-radius: 3px; white-space: nowrap; line-height: 1.5; }
.code.as { color: var(--as); background: var(--as-soft); } .code.bx { color: var(--bx); background: var(--bx-soft); } .code.hr { color: var(--ink-2); background: var(--sunk); }
.badge { font-size: .75rem; font-weight: 650; padding: 1px 7px; border-radius: 10px; white-space: nowrap; border: 1px solid transparent; }
.badge.ok { color: var(--ok); border-color: currentColor; }
.badge.mv { color: var(--as); border-color: currentColor; }
.badge.left { color: var(--bad); background: var(--bad-soft); }
.badge.none { color: var(--muted); border: 1px dashed var(--line-2); }
.empty { text-align: center; padding: 56px 20px; background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--r-m); display: grid; gap: 10px; justify-items: center; }
.empty p { color: var(--ink-2); max-width: 46ch; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; }
main > .panel, main > .kpis, .view-head + .panel { margin-bottom: 0; }
main > * + * { margin-top: 20px; }
main > .view-head + * { margin-top: 0; }
.head-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.list-search input { width: 100%; }
.head-acts .list-search input { width: 240px; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.legend-i { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend-i span { white-space: nowrap; }
.legend-i i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* ---------- KPI tiles ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px 18px 14px; min-width: 0; box-shadow: var(--shadow);
       display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px; align-items: end; border-top: 3px solid var(--brand); }
.kpi > .kpi-l, .kpi > .kpi-v, .kpi > .kpi-c { grid-column: 1; }
.kpi .kpi-spark { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
.kpi .kpi-spark polyline { fill: none; stroke: var(--brand); stroke-width: 1.8; }
.kpi .kpi-spark circle { fill: var(--brand-red); }
.kpi .kpi-spark .kbar { fill: var(--line-2); } .kpi .kpi-spark .kbar.on { fill: var(--brand-red); }
.kpi-l { font-size: .867rem; color: var(--ink-2); font-weight: 550; }
.kpi-v { font-size: clamp(1.5rem, 1.1rem + .9vw, 2.2rem); color: var(--ink); font-weight: 650; letter-spacing: -0.02em; line-height: 1.25; margin-top: 2px; }
.kpi-c { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.delta { font-weight: 650; color: var(--ink-2); }
.delta.pos { color: var(--ok); } .delta.neg { color: var(--bad); }

/* ---------- charts ---------- */
.chart { width: 100%; position: relative; }
.chart svg { display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--f); }
.chart .ax-focus { fill: var(--brand-red); font-weight: 700; }
.chart .focus-band { fill: var(--amber-soft); }
.chart .focus-line { stroke: var(--amber-line); stroke-width: 2; stroke-dasharray: 3 3; }
.chart .avg { stroke: var(--ink-2); stroke-width: 1.4; stroke-dasharray: 5 4; }
.chart .avg-l { fill: var(--ink-2); font-weight: 600; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover { fill: color-mix(in srgb, var(--ink) 5%, transparent); }
.chart .ln { fill: none; stroke-width: 2.2; stroke-linejoin: round; }
.chart .dot { stroke: var(--surface); stroke-width: 1.5; }
.spark { display: block; } .spark polyline { fill: none; stroke: var(--brand-2); stroke-width: 1.5; } .spark circle { fill: var(--brand-red); }
.tip { position: fixed; z-index: 60; display: none; pointer-events: none; background: var(--ink); color: var(--surface); padding: 7px 10px; border-radius: var(--r-s); font-size: .8rem; line-height: 1.45; max-width: 280px; }

/* ---------- horizontal bars ---------- */
.hbars { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.hb-l { display: flex; justify-content: space-between; gap: 12px; font-size: .933rem; }
.hb-name { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hb-v { font-weight: 600; white-space: nowrap; }
.hb-bar { position: relative; height: 8px; background: var(--sunk); border-radius: 4px; margin-top: 4px; }
.hb-bar i { position: absolute; inset: 0 auto 0 0; background: var(--brand-2); border-radius: 4px; }
.hb-bar b { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--amber-line); border-radius: 1px; }
.hb-sub { font-size: .8rem; color: var(--muted); margin-top: 3px; }

/* ---------- individual ---------- */
.ind { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
.ind-list { position: sticky; top: 160px; }
.ind-list .panel-h { display: grid; gap: 6px; justify-content: stretch; }
.li-scroll { max-height: calc(100vh - 230px); overflow-y: auto; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 9px 16px; cursor: pointer; color: inherit; }
.li:hover { background: var(--surface-2); }
.li.on { background: var(--amber-soft); box-shadow: inset 3px 0 0 var(--amber); }
.li-m { display: grid; gap: 2px; min-width: 0; }
.li-m .pn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-v { font-weight: 600; font-size: .867rem; color: var(--ink-2); white-space: nowrap; }
.li-pin { grid-column: 1 / -1; font-size: .75rem; color: var(--warn); font-weight: 600; }
.ind-card { display: grid; gap: 20px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 18px 20px; }
.card-head h2 { font-size: 1.6rem; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0 12px; }
dl.facts.inline { grid-template-columns: auto 1fr; }
dl.facts.inline dd { text-align: left; font-weight: 500; }
.split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 12px; }
.hr-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }
.hr-grid dl.facts dd { text-align: left; font-weight: 500; }
.reason { display: block; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); display: grid; gap: 12px; }
.ev { position: relative; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; font-size: .933rem; }
.ev::before { content: ''; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink-2); }
.ev.k-h::before { border-color: var(--ok); background: var(--ok); }
.ev.k-m::before, .ev.k-t::before { border-color: var(--as); }
.ev.k-x::before { border-color: var(--bad); background: var(--bad); }
.ev.fut { opacity: .65; }
.ev-date { color: var(--muted); white-space: nowrap; }
.ev-what { font-weight: 550; min-width: 0; }
.ev-sub { display: block; font-weight: 400; color: var(--ink-2); font-size: .867rem; }
.spells { margin: 0; padding-left: 20px; font-size: .933rem; display: grid; gap: 3px; }

/* ---------- compare ---------- */
.cmp { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.adder { display: grid; gap: 8px; }
.adder.row { grid-template-columns: minmax(0, 1fr) auto; }
.hits { display: grid; border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; }
.hit-b { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); padding: 7px 10px; cursor: pointer; color: inherit; }
.hit-b:last-child { border-bottom: 0; }
.hit-b:hover { background: var(--surface-2); }
.hit-b .pn { font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit-b .pc { grid-row: 2; }
.hit-b .li-v { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
.cchips { display: flex; gap: 6px; flex-wrap: wrap; }
.cchip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 8px; border: 1px solid var(--line-2); border-radius: 14px; font-size: .8rem; font-weight: 550; max-width: 220px; }
.cchip i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.cchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cchip button { border: 0; background: none; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 5px; color: var(--muted); border-radius: 50%; }
.cchip button:hover { color: var(--bad); background: var(--bad-soft); }

/* ---------- all employees ---------- */
.tbl-wrap.tall { max-height: calc(100vh - 250px); overflow: auto; }
.t.emp thead th { position: sticky; top: 0; z-index: 2; }
.t.emp td { white-space: nowrap; }
.t.emp td:first-child, .t.emp th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 190px; }
.t.emp th:first-child { z-index: 3; }
.t .fcol { background: var(--amber-soft); }
.t.emp td.fcol { background: color-mix(in srgb, var(--amber-soft) 60%, var(--surface)); }
.sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.sort:hover { color: var(--ink); }
.sort .ar { font-size: .65rem; color: var(--ink); }
.clip { display: inline-block; max-width: 260px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
.t tbody tr:hover td { background: var(--surface-2); }

/* ---------- in & out ---------- */
.io-bar { padding: 12px 16px 10px; }
.io-f { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
.io-split { width: 1px; align-self: stretch; background: var(--line-2); margin: 0 2px; }
.io-scope { font-size: .8rem; color: var(--muted); margin-top: 8px; max-width: 110ch; }
.sect { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid var(--line-2); }
.sect h3 { font-size: 1.15rem; }
.showing { color: var(--ink-2); }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.lead-stat { margin-bottom: 14px; font-size: 1.02rem; }
.panel-foot { padding: 10px 18px 12px; border-top: 1px solid var(--line); }
.chart .b-in { fill: var(--ok); } .chart .b-out { fill: var(--bad); } .chart .b-mv { fill: var(--as); opacity: .28; }
.chart .zero { stroke: var(--ink-2); stroke-width: 1.2; }
.chart .bar-l { fill: var(--ink-2); font-weight: 600; font-size: 10.5px; }
.legend-i .mv-sw { background: var(--as); opacity: .35; }
:root[data-theme="dark"] .chart .b-mv { opacity: .5; }
main > .two, main > .three { margin-top: 20px; }

/* ---------- manpower ---------- */
.note.good { background: color-mix(in srgb, var(--ok) 10%, var(--surface)); border-left-color: var(--ok); } .note.good .icon { color: var(--ok); }
.mp-wrap { overflow-x: auto; }
table.mp { font-size: .9rem; }
.t.mp th, .t.mp td { padding: 6px 10px; white-space: nowrap; }
.t.mp tbody th { text-align: left; font-weight: 500; color: var(--ink); position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 170px; font-size: .9rem; padding-left: 22px; }
.t.mp thead th:first-child { position: sticky; left: 0; z-index: 3; }
.t.mp tr.grp th { background: var(--surface-2); font-weight: 650; color: var(--ink-2); padding-left: 10px; font-size: .8rem; letter-spacing: .01em; }
.t.mp tr.sub th, .t.mp tr.sub td { font-weight: 650; background: var(--surface-2); }
.t.mp tr.sub th { padding-left: 10px; }
.t.mp tr.grand th, .t.mp tr.grand td { font-weight: 700; border-top: 2px solid var(--line-2); background: var(--amber-soft); }
.t.mp tr.grand th { padding-left: 10px; }
.t.mp .tov-b th, .t.mp .tov-b td { color: var(--ink-2); font-size: .85rem; background: var(--surface); }
.t.mp .tov-b tr:first-child th, .t.mp .tov-b tr:first-child td { border-top: 2px solid var(--line-2); }
.t.mp .tov-b th { padding-left: 10px; cursor: help; }
.t.mp td.per, .t.mp th.per { border-left: 1px solid var(--line-2); font-weight: 600; }
.t.mp td.part { background-image: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--amber) 12%, transparent) 6px 8px); }
.t.mp td.d-pos { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); font-weight: 650; }
.t.mp td.d-neg { background: var(--bad-soft); color: var(--bad); font-weight: 650; }
.t.mp tbody tr:hover td:not(.d-pos):not(.d-neg), .t.mp tbody tr:hover th { background: var(--surface-2); }
.trust { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; }
.trust p { max-width: 72ch; }
.trust dl.facts dd { text-align: right; }
details.mapd, details.fixd { border-top: 1px solid var(--line); }
details.mapd summary, details.fixd summary { cursor: pointer; padding: 12px 18px; font-weight: 600; }
details.mapd select { padding: .3rem .45rem; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); max-width: 220px; }
.fix-wrap { max-height: 420px; overflow: auto; }
.fix-wrap .pn { font-weight: 600; }

/* number headers line up with their numbers (beats .t th) */
.t th.num { text-align: right; }
.t th.num .sort { flex-direction: row; }

/* ---------- leavers by month ---------- */
.lv-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.lv-chip { display: grid; justify-items: center; gap: 0; min-width: 58px; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); cursor: pointer; }
.lv-chip b { font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.lv-chip span { font-size: 1.15rem; font-weight: 650; }
.lv-chip:hover { border-color: var(--ink-2); }
.lv-chip.none { cursor: default; opacity: .5; }
.lv-chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); }
.lv-chip[aria-pressed="true"] b, .lv-chip[aria-pressed="true"] span { color: #fff; }
:root[data-theme="dark"] .lv-chip[aria-pressed="true"] { background: var(--amber); border-color: var(--amber-line); }
.lv-chip.lv-all { min-width: 96px; margin-right: 8px; }
.lv-bar { display: grid; gap: 8px; }
.lv-hint { font-size: .867rem; color: var(--muted); }
.lv-hint b { color: var(--ink); }
.lv-sec { scroll-margin-top: 90px; }
.lv-empty { display: flex; gap: 14px; align-items: baseline; padding: 4px 18px; }
.lv-empty h3 { font-size: 1rem; }
table.lv { table-layout: fixed; min-width: calc(250px + 110px + 100px + var(--lv-n, 8) * 76px); }
table.lv col.c-emp { width: 250px; } table.lv col.c-day { width: 110px; } table.lv col.c-avg { width: 100px; } table.lv col.c-m { width: 76px; }
table.lv td:first-child { overflow: hidden; }
table.lv td:first-child, table.lv th:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: 1px 0 0 var(--line); }
table.lv .person .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
table.lv .lvm { background: var(--amber-soft); }
table.lv th.lvm { color: var(--ink); }
table.lv tbody tr:hover td.lvm { background: color-mix(in srgb, var(--amber-soft) 80%, var(--ink) 5%); }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two, .hr-grid, .three, .trust { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 1020px) {
  .files-grid, .ind, .cmp { grid-template-columns: minmax(0, 1fr); }
  .ind-list { position: static; }
  .li-scroll { max-height: 300px; }
}
@media (max-width: 880px) {
  .up-grid { grid-template-columns: 1fr; gap: 36px; }
  .up { padding: 24px 18px 40px; }
  .up-top { margin-bottom: 28px; }
  .up h1 { font-size: 2.05rem; }
  .bar-in { padding: 8px 14px; gap: 10px; flex-wrap: wrap; }
  .bar .brand-name small { display: none; }
  .tabs { order: 3; flex-basis: 100%; }
  .tab[aria-selected="true"]::after { bottom: -8px; }
  main { padding: 18px 14px 48px; }
  .filters-in { padding: 8px 14px; gap: 10px; }
  .fg select { max-width: 160px; }
  .bar { position: static; }
  .tbl-wrap.tall { max-height: 70vh; }
  .head-acts .list-search input { width: 100%; }
  .head-acts { width: 100%; }
  .io-split { display: none; }
  .io-f .fg select { max-width: 150px; }
}
@media (max-width: 520px) {
  .cov { grid-template-columns: 28px repeat(12, minmax(0, 1fr)); gap: 3px; }
  .cov .mh .s { display: none; } .cov .mh .l { display: inline; }
  .cell .n { font-size: .6rem; }
  .board { padding: 16px 12px 14px; }
  .bar-actions .btn .lbl { display: none; }
  .kpi-v { font-size: 1.35rem; }
  .ev { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .ev-date { font-size: .8rem; }
  table.lv col.c-emp { width: 168px; } table.lv col.c-day { width: 96px; } table.lv col.c-avg { width: 88px; } table.lv col.c-m { width: 64px; }
  table.lv { min-width: calc(168px + 96px + 88px + var(--lv-n, 8) * 64px); }
}

/* ---------- wide screens: use the whole page ---------- */
.tab { min-height: 40px; }
.ov-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
@media (min-width: 1100px) { .ov-grid { grid-template-columns: minmax(0, 1.85fr) minmax(360px, 1fr); align-items: stretch; } }
.t.top .rk { width: 40px; color: var(--muted); font-weight: 600; }
.t.top td:nth-child(2) { min-width: 200px; }
@media (max-width: 1250px) { .t.top .mcol { display: none; } }
.dep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 20px; align-items: start; }
@media (min-width: 1500px) { .dep-grid .dg-wide { grid-row: span 2; } }
.lv-pair { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1500px) { .lv-pair { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
.ic-hr { container-type: inline-size; }
@container (max-width: 720px) { .hr-grid { grid-template-columns: minmax(0, 1fr); gap: 20px; } }
@media (min-width: 1500px) {
  .ind { grid-template-columns: 350px minmax(0, 1fr); }
  .ind-card { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
  .ind-card > * { grid-column: 1 / -1; }
  .ind-card > .ic-chart, .ind-card > .ic-split { grid-column: 1; }
  .ind-card > .ic-hr { grid-column: 2; grid-row: 3 / span 2; }
  .files-grid { grid-template-columns: minmax(0, 1fr) 460px; }
  .cmp { grid-template-columns: 340px minmax(0, 1fr); }
}
@media (min-width: 1800px) {
  html { font-size: 15.5px; }
  .kpis { gap: 18px; }
  main > * + * { margin-top: 22px; }
}
@media (max-width: 880px) {
  .bar .brand-name { padding-left: 10px; font-size: .95rem; }
  .brand-mark { height: 34px; }
  .tab[aria-selected="true"]::after { bottom: 0; }
  .kpi .kpi-spark { display: none; }
  .fg.grow { max-width: none; }
}

/* overview: the chart fills the height of its row */
@media (min-width: 1100px) {
  .ov-grid > .panel { display: flex; flex-direction: column; }
  .ov-grid > .panel > .panel-b { flex: 1; display: flex; flex-direction: column; }
  .ov-grid .chart { flex: 1; height: auto !important; min-height: 320px; }
}
.legend-i .avg-sw { width: 16px; height: 0; border-top: 2px dashed var(--ink-2); border-radius: 0; vertical-align: 3px; }
/* person card facts run across the card */
dl.facts.inline { display: flex; flex-wrap: wrap; gap: 10px 40px; margin-top: 4px; }
dl.facts.inline .fact { display: grid; gap: 1px; }
dl.facts.inline dt { font-size: .8rem; }
dl.facts.inline dd { font-weight: 600; }
.card-head h2 { color: var(--brand); }
:root[data-theme="dark"] .card-head h2 { color: var(--ink); }

/* medium widths: keep every tab visible and the filter strip on one line */
.kpi .kpi-spark { width: clamp(60px, 5.5vw, 104px); height: auto; }
@media (max-width: 1500px) {
  .bar-actions .btn .lbl { display: none; }
  .tab { padding: 0 .7rem; }
  .filters-in { gap: 12px; }
  .filters .fg select { max-width: 190px; }
  .filters .seg button { padding: .4rem .6rem; }
  .fg.grow { flex-basis: 170px; }
}
@media (max-width: 1380px) {
  .bar-in { flex-wrap: wrap; row-gap: 0; }
  .tabs { order: 3; flex-basis: 100%; margin: 0 calc(-1 * var(--pad)); padding: 0 var(--pad); border-top: 1px solid var(--line); }
  .bar-actions { margin-left: auto; }
  .tab[aria-selected="true"]::after { bottom: 0; }
}
:root[data-theme="dark"] .filters .seg button[aria-pressed="true"] { background: #fff; color: #14325F; }

</style>

<div id="root"></div>

<script>
/* ==========================================================================
   core.js — pure parsing logic. No DOM, no network, no storage.
   Everything here reads only the cells of the columns listed in the spec (§3);
   other columns are never touched after SheetJS's own parse.
   ========================================================================== */
(function (root) {
'use strict';

/* ---------- text normalisation ---------------------------------------- */

// Greek capitals that look like Latin ones → Latin (§4.3)
const LOOK = { 'Α':'A','Β':'B','Ε':'E','Ζ':'Z','Η':'H','Ι':'I','Κ':'K','Μ':'M',
               'Ν':'N','Ο':'O','Ρ':'P','Τ':'T','Υ':'Y','Χ':'X' };

function fold(s) {
  s = String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  let out = '';
  for (const ch of s) out += LOOK[ch] || ch;
  return out;
}
const normHeader = s => fold(s).replace(/\s+/g, ' ').trim();
const normLoose  = s => normHeader(s).replace(/[^A-Z0-9\u0370-\u03FF]/g, '');

// Search key for people: accents/case/lookalikes ignored
const searchKey = s => fold(s).replace(/\s+/g, ' ').trim();

/* nameKey (§4.3). The spec says "replace anything not A–Z with a space", but
   Greek letters without a Latin lookalike (Π Δ Λ Σ Γ …) would then vanish and
   ΠΑΠΑΔΟΠΟΥΛΟΣ would reduce to "OY". Greek capitals are kept as letters. */

    return [...nameMap.get(k)][0];
  };

  const byAka = new Map();
  const get = aka => { let p = byAka.get(aka); if (!p) byAka.set(aka, p = { aka, hireRows: [], exitRows: [] }); return p; };
  hr.hires.forEach(h => { const a = place(h, 'hires'); if (a) get(a).hireRows.push(Object.assign({ recovered: !h.aka }, h)); });
  hr.exits.forEach(e => { const a = place(e, 'exits'); if (a) get(a).exitRows.push(Object.assign({ recovered: !e.aka }, e)); });

  const people = [];
  for (const p of byAka.values()) people.push(derivePerson(p, asOf));
  return { people, byAka: new Map(people.map(p => [p.aka, p])), recovery: rec, unplaced };
}

function derivePerson(p, asOf) {
  // hires: one per distinct date; an exit's ΠΡΟΣΛΗΨΗ adds a hire if it isn't there
  const hmap = new Map();
  for (const h of p.hireRows) {
    if (h.hired == null) continue;
    const cur = hmap.get(h.hired);
    if (!cur) hmap.set(h.hired, { d: h.hired, division: h.division, station: h.station, isMove: h.isMove, row: h });
    else if (h.isMove) cur.isMove = true;
  }
  for (const e of p.exitRows) if (e.hired != null && !hmap.has(e.hired)) hmap.set(e.hired, { d: e.hired, division: e.division, station: '', isMove: false, fromExit: true });
  const hires = [...hmap.values()].sort((a, b) => a.d - b.d);
  const exits = [...p.exitRows].sort((a, b) => a.date - b.date);

  // latest-dated row wins for each attribute
  const best = {};
  const offer = (k, v, d) => { if (v == null || v === '') return; const dd = d == null ? -Infinity : d; if (!best[k] || dd >= best[k].d) best[k] = { v, d: dd }; };
  for (const h of p.hireRows) { offer('division', h.division, h.hired); offer('station', h.station, h.hired); offer('nat', h.nat, h.hired); offer('rate', h.rate, h.hired); offer('name', h.name, h.hired); offer('dob', h.dob, h.hired); }
  for (const e of exits) { offer('division', e.division, e.date); offer('station', e.station, e.date); offer('rate', e.rate, e.date); offer('dob', e.dob, e.date); if (!best.name) offer('name', e.name, e.date); }
  const val = k => best[k] ? best[k].v : (k === 'rate' || k === 'dob' ? null : '');

  const codes = []; const seen = new Set();
  for (const r of [...p.hireRows, ...exits]) {
    if (!r.amKey) continue;
    const k = r.amKey + '|' + r.division;
    if (!seen.has(k)) { seen.add(k); codes.push({ amKey: r.amKey, am: r.am, division: r.division, company: DIV_CO[r.division] || '' }); }
  }

  const postings = [];
  for (const h of p.hireRows) if (h.hired != null) postings.push({ d: h.hired, division: h.division, station: h.station, src: 'hire' });
  for (const e of exits) postings.push({ d: e.date, division: e.division, station: e.station, src: 'exit' });
  postings.sort((a, b) => a.d - b.d);

  // timeline
  const transfers = exits.filter(e => e.kind === 'transfer');
  const events = [];
  for (const h of hires) {
    const move = h.isMove || transfers.some(t => Math.abs(t.date - h.d) <= MOVE_WINDOW);
    events.push({ d: h.d, code: move ? 'm' : 'h', division: h.division, station: h.station, fromExit: !!h.fromExit, hire: h });
  }
  for (const e of exits) events.push({ d: e.date, code: e.kind === 'transfer' ? 't' : 'x', kind: e.kind, division: e.division, station: e.station, exit: e });
  const rank = c => (c === 'h' || c === 'm') ? 0 : 1;
  events.sort((a, b) => a.d - b.d || rank(a.code) - rank(b.code));
  const past = events.filter(e => e.d <= asOf);
  const future = exits.filter(e => e.date > asOf);

  const last = past[past.length - 1];
  const status = !last ? null : (last.code === 'h' || last.code === 'm') ? 'active' : last.code === 't' ? 'transferred' : last.kind;

  // length of service: spells of actual employment (a move never closes one)
  const spells = []; let open = null, closed = 0;
  for (const ev of past) {
    if (ev.code === 'h' || ev.code === 'm') { if (!open) open = { start: ev.d, startCode: ev.code, division: ev.division, station: ev.station, moves: [] }; }
    else if (ev.code === 't') { if (open) { open.moves.push(ev.d); ev.servedAt = closed + ev.d - open.start; } }
    else { if (open) { spells.push(Object.assign(open, { end: ev.d, endKind: ev.kind })); closed += ev.d - open.start; ev.servedAt = closed; ev.spellServed = ev.d - open.start; open = null; } }
  }
  let served = closed;
  if (open) { spells.push(Object.assign(open, { end: null })); served += asOf - open.start; }
  const left = LEFT_KINDS.has(status);
  const lastLeave = left ? last.exit : null;
  const firstHire = hires.length ? hires[0].d : null;
  const endRef = left ? last.d : asOf;
  const hasHire = firstHire != null;

  return {
    aka: p.aka, hireRows: p.hireRows, exitRows: exits, hires, exits, codes, postings, events, past, future,
    status, left, lastLeave, spells,
    served: hasHire ? served : null,
    gap: hasHire ? Math.max(0, endRef - firstHire - served) : null,
    firstHire, latestHire: hires.length ? hires[hires.length - 1].d : null,
    lastEventDay: last ? last.d : null,
    division: val('division'), station: val('station'), nat: val('nat'), rate: val('rate'), name: val('name'), dob: val('dob'),
    recoveredRows: p.hireRows.filter(r => r.recovered).length + exits.filter(r => r.recovered).length,
  };
}

// employed on day d? Starts from `pre` and replays events up to and including d.
function employedAt(h, d) {
  let on = !!h.pre;
  for (const ev of h.events) {
    if (ev.d > d) break;
    if (ev.code === 'h' || ev.code === 'm') on = true;
    else if (ev.code === 'x') on = false;
  }
  return on;
}
function postingAt(h, d) {
  let cur = null;
  for (const p of h.postings) { if (p.d > d) break; if (p.division || p.station) cur = p; }
  return cur || h.postings[0] || { division: h.division, station: h.station };
}

/* --------------------------------------------------------------- main -- */
function build(S) {
  const asOf = C.todayDay();
  const year = S.year;
  const W0 = C.dayOf(year - 3, 1, 1);

  // ---- payroll people (§4.1)
  const pp = new Map(), codeIdx = new Map();
  const months = { AS: new Set(), BX: new Set() };
  const files = Object.values(S.payroll).sort((a, b) => a.month - b.month || a.company.localeCompare(b.company));
  for (const f of files) {
    months[f.company].add(f.month);
    for (const r of f.rows) {
      const key = r.aka ? 'A:' + r.aka : 'C:' + f.company + ':' + r.codeKey;
      let p = pp.get(key);
      if (!p) pp.set(key, p = { key, aka: r.aka, rows: [], codeSeen: {}, codeKeys: {}, surnames: [], firsts: [], rates: [] });
      p.rows.push({ co: f.company, m: f.month, dept: r.dept, h: r.hours, c: r.cost });
      const cs = p.codeSeen[f.company] || (p.codeSeen[f.company] = {});
      if (r.code) cs[r.code] = (cs[r.code] || 0) + 1;
      if (r.codeKey) { (p.codeKeys[f.company] || (p.codeKeys[f.company] = new Set())).add(r.codeKey); const ck = f.company + ':' + r.codeKey; if (!codeIdx.has(ck)) codeIdx.set(ck, p); }
      p.surnames.push(r.surname); p.firsts.push(r.name);
      if (r.rate) p.rates.push(r.rate);
    }
  }

  // ---- HR (§4.2–§5)
  const H = S.hr ? buildHR(S.hr, asOf) : null;
  const people = [];
  let matched = 0;
  const addPayroll = p => {
    const codes = {}; for (const co in p.codeSeen) codes[co] = mostCommon(p.codeSeen[co]);
    const deptH = {}; for (const r of p.rows) deptH[r.dept] = (deptH[r.dept] || 0) + r.h;
    const depts = Object.keys(deptH).sort((a, b) => deptH[b] - deptH[a]);
    const rs = p.rates;
    people.push({
      key: p.key, aka: p.aka, onPayroll: true, rows: p.rows,
      surname: longest(p.surnames), first: longest(p.firsts),
      codes, companies: Object.keys(codes).sort(), dept: depts[0] || '', depts,
      rate: rs.length ? { mean: rs.reduce((a, b) => a + b, 0) / rs.length, min: Math.min(...rs), max: Math.max(...rs) } : null,
      hr: null, _p: p,
    });
  };
  for (const p of pp.values()) addPayroll(p);
  const byKey = new Map(people.map(p => [p.key, p]));

  let hrOnly = 0;
  if (H) {
    for (const h of H.people) {
      let target = byKey.get('A:' + h.aka);
      if (target && target.hr) target = null;
      if (!target) for (const c of h.codes) {
        if (!c.company) continue;
        const pr = codeIdx.get(c.company + ':' + c.amKey);
        const cand = pr && byKey.get(pr.key);
        if (cand && !cand.hr) { target = cand; break; }
      }
      if (target) { target.hr = h; h.pre = !h.hires.length; matched++; continue; }
      // HR-only: kept if they touch the window (an event on/after W0, or employed on W0)
      h.pre = !h.hires.length && h.exits.length > 0;
      const touches = h.events.some(e => e.d >= W0) || employedAt(h, W0);
      if (!touches) continue;
      hrOnly++;
      people.push({
        key: 'H:' + h.aka, aka: h.aka, onPayroll: false, rows: [], surname: '', first: '', hrName: h.name,
        codes: {}, companies: [], dept: '', depts: [], rate: null, hr: h,
      });
    }
  }

  // ---- finish each person
  const hrCodeList = h => h.codes.map(c => ({ co: c.company || 'Α/Μ', code: c.am || c.amKey }));
  people.forEach((p, i) => {
    p.id = i;
    const h = p.hr;
    p.status = h ? (h.status || 'active') : 'nohr';
    p.left = LEFT_KINDS.has(p.status);
    p.ghost = !!(h && !p.onPayroll && !p.left && h.lastEventDay != null && h.lastEventDay < W0);
    p.name = p.onPayroll ? [p.surname, p.first].filter(Boolean).join(' ') : (h.name || '');
    if (h) p.hrName = h.name;
    p.codeList = p.onPayroll ? p.companies.map(co => ({ co, code: p.codes[co] })) : hrCodeList(h);
    p.age = h && h.dob != null ? Math.floor((asOf - h.dob) / 365.2425) : null;
    p.search = C.searchKey([p.name, p.hrName, p.aka, ...p.codeList.map(c => c.code), ...p.codeList.map(c => c.co + ' ' + c.code),
      ...p.codeList.map(c => String(c.code).replace(/^0+/, ''))].filter(Boolean).join(' | '));
    delete p._p;
  });

  const union = [...new Set([...months.AS, ...months.BX])].sort((a, b) => a - b);
  const depts = {};
  for (const p of people) for (const r of p.rows) (depts[r.co] || (depts[r.co] = new Set())).add(r.dept);
  const payrollPeople = people.filter(p => p.onPayroll);

  return {
    asOf, year, W0, people, hasHR: !!H,
    period: { Both: union, AS: [...months.AS].sort((a, b) => a - b), BX: [...months.BX].sort((a, b) => a - b) },
    depts: { AS: [...(depts.AS || [])].sort(), BX: [...(depts.BX || [])].sort(), Both: [...new Set([...(depts.AS || []), ...(depts.BX || [])])].sort() },
    // stats used by the Files panel (and later In & Out / Manpower)
    payrollCount: payrollPeople.length,
    both: payrollPeople.filter(p => p.companies.length > 1).length,
    hours: payrollPeople.reduce((s, p) => s + p.rows.reduce((a, r) => a + r.h, 0), 0),
    matched, noHR: payrollPeople.filter(p => !p.hr).length, hrOnly,
    ghosts: people.filter(p => p.ghost).length,
    recovery: H ? H.recovery : null, unplaced: H ? H.unplaced : [],
  };
}

root.Model = { build, employedAt, postingAt, REASONS, KIND_LABEL, STATUS_LABEL, LEFT_KINDS, DIV_CO };
if (typeof module !== 'undefined') module.exports = root.Model;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ==========================================================================

(function () {
'use strict';
const C = window.Core;
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 0) => n == null || !isFinite(n) ? '–' : n.toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtH = n => fmt(n, Math.abs(n - Math.round(n)) > 0.001 ? 1 : 0);
const plural = (n, one, many) => fmt(n) + ' ' + (n === 1 ? one : (many || one + 's'));
const tick = () => new Promise(r => setTimeout(r, 0));

const ICON = {
  check: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
  warn: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.8L15 14H1L8 1.8z"/><path d="M8 6.2v3.6M8 11.6v.4" stroke-width="1.8"/></svg>',
  info: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.4"/><path d="M8 7.2v4M8 4.8v.4" stroke-width="1.8"/></svg>',
  lock: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.2"/><path d="M5.2 7V5a2.8 2.8 0 015.6 0v2"/></svg>',
  plus: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10"/></svg>',
  trash: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></svg>',
  moon: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.5 9.8A5.8 5.8 0 016.2 2.5a5.8 5.8 0 107.3 7.3z"/></svg>',
  sun: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9L13 13M3 13l1.1-1.1M11.9 4.1L13 3"/></svg>',
};

/* ---------- state (memory only) ---------- */
const fresh = () => ({
  year: new Date().getFullYear(),
  files: [],            // {id, name, size, kind, status, month, company, note, info}
  payroll: {},          // 'AS-3' → {fileId, month, company, rows, parsedHours, totalsHours, missing}
  hr: null,             // {fileId, hires, exits, stats, missing}
  mp: null,             // {fileId, sheets, months, stations, divisions}
  pendingBufs: {},      // fileId → ArrayBuffer, only for payroll files awaiting month/company
  busy: null,           // {step, done, total, file}
  view: 'files',
  landed: false,        // has the first load picked a view yet?
  model: null,          // derived people etc. (built by Model.build)
  f: { co: 'Both', focus: 0, dept: '', status: '', basis: 'worked', q: '' },
  sel: null,            // person open in Individual
  cmp: { mode: 'people', people: [], depts: [] }, cmpQ: '',
  sort: { key: 'total', dir: -1 },
  lvSel: [],            // Leavers tab: months picked (empty = all)
  mpv: { from: '', to: '', div: '', fig: 'end', mode: 'computed' }, mpMap: null,
  io: { div: '', station: '', month: 0, kind: '', reason: '', tab: 'left', sort: { key: 'date', dir: -1 } },

let S = fresh();
let gen = 0;          // bumped by Clear all data; any read still running sees it and stops

let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
const logoSrc = (window.ICTS_LOGO || '').trim();

/* ---------- ingest pipeline: payroll → HR → merge → derive ---------- */
const STEPS = [['read', 'Reading files'], ['payroll', 'Payroll'], ['hr', 'Hirings & departures'], ['merge', 'Merge'], ['derive', 'Derive']];

async function ingest(list) {
  if (!window.XLSX || !list.length) return;   // the upload screen already explains a missing reader
  const g = gen;
  S.busy = { step: 'read', done: 0, total: list.length, file: '' };
  showApp(); render();
  await tick(); if (g !== gen) return;

  // 1. read + classify
  const items = [];
  for (const f of list) {
    S.busy.file = f.name; renderProgress(); await tick(); if (g !== gen) return;
    const entry = { id: nextId++, name: f.name, size: f.size || (f.buf && f.buf.byteLength) || 0, kind: 'unknown', status: 'reading' };
    S.files.push(entry);
    try {
      const buf = f.buf || await f.arrayBuffer();
      if (g !== gen) return;
      const cls = C.classify(f.name, C.peekSheets(buf));

    } catch (e) {

    }

  }

  // 2. payroll
  S.busy = { step: 'payroll', done: 0, total: items.filter(i => i.cls.kind.startsWith('payroll')).length, file: '' };
  for (const it of items.filter(i => i.cls.kind === 'payroll' || i.cls.kind === 'payroll-unnamed')) {
    S.busy.file = it.entry.name; renderProgress(); await tick(); if (g !== gen) return;
    if (it.cls.kind === 'payroll-unnamed') {

  // 3. HR and manpower
  const hrs = items.filter(i => i.cls.kind === 'hr'), mps = items.filter(i => i.cls.kind === 'manpower');
  S.busy = { step: 'hr', done: 0, total: hrs.length + mps.length, file: '' };
  for (const it of hrs) {
    S.busy.file = it.entry.name; renderProgress(); await tick(); if (g !== gen) return;
    try {
      const wb = C.readSheets(it.buf, [it.cls.sheets.hires, it.cls.sheets.exits], true);
      const r = C.parseHR(wb, it.cls.sheets);

      S.hr = Object.assign(r, { fileId: it.entry.id });
      Object.assign(it.entry, { status: r.error ? 'warn' : 'ok', note: r.error || '' });
    } catch (e) { Object.assign(it.entry, { status: 'error', note: 'Could not read the hirings and departures sheets (' + (e.message || e) + ').' }); }
    S.busy.done++;
  }
  for (const it of mps) {
    S.busy.file = it.entry.name; renderProgress(); await tick(); if (g !== gen) return;
    try {
      const wb = C.readSheets(it.buf, Object.values(it.cls.sheets), true);
      const r = C.parseManpower(wb, it.cls.sheets);
      if (S.mp) markReplaced(S.mp.fileId, it.entry);
      S.mp = Object.assign(r, { fileId: it.entry.id });
      it.entry.status = r.months.length ? 'ok' : 'warn';
      if (!r.months.length) it.entry.note = 'No month headers were found next to AIRPORTS, BORDER or CYPRUS.';
    } catch (e) { Object.assign(it.entry, { status: 'error', note: 'Could not read the manpower sheets (' + (e.message || e) + ').' }); }
    S.busy.done++;
  }
  items.filter(i => i.cls.kind === 'unknown').forEach(i => { i.entry.status = 'unknown'; });
  items.length = 0;   // drop buffers

  await rebuild();
}

function readPayroll(entry, buf, sheet, month, company) {
  try {
    const wb = C.readSheets(buf, [sheet], false);
    const r = C.parsePayroll(wb, sheet);
    if (r.error) { Object.assign(entry, { status: 'error', note: r.error, month, company }); return; }
    const key = company + '-' + month;
    if (S.payroll[key]) markReplaced(S.payroll[key].fileId, entry);
    S.payroll[key] = Object.assign(r, { fileId: entry.id, month, company });
    Object.assign(entry, { kind: 'payroll', status: 'ok', month, company });
  } catch (e) { Object.assign(entry, { status: 'error', note: 'Could not read the Print sheet (' + (e.message || e) + ').', month, company }); }
}
function markReplaced(oldId, byEntry) {
  const old = S.files.find(f => f.id === oldId);
  if (old) { old.status = 'replaced'; old.note = 'Replaced by ' + byEntry.name + '.'; }
}

async function rebuild() {
  const g = gen;
  S.busy = { step: 'merge', done: 0, total: 1, file: '' }; renderProgress(); await tick(); if (g !== gen) return;
  const model = window.Model ? window.Model.build(S) : basicModel();
  S.busy = { step: 'derive', done: 0, total: 1, file: '' }; renderProgress(); await tick(); if (g !== gen) return;
  S.model = model;
  S.busy = null;
  if (!S.landed && Object.keys(S.payroll).length) {
    S.landed = true;
    S.view = warnings().some(w => w[0] !== 'info') ? 'files' : 'overview';
  }
  render();
}

// Stage 1: who is on payroll, keyed on Α.Κ.Α. (falls back to company + code)
function basicModel() {
  const people = new Map();
  let hours = 0;
  for (const k in S.payroll) {
    const pf = S.payroll[k];
    for (const r of pf.rows) {
      const key = r.aka ? 'A:' + r.aka : 'C:' + pf.company + ':' + r.codeKey;
      let p = people.get(key);
      if (!p) people.set(key, p = { key, companies: new Set(), hours: 0 });
      p.companies.add(pf.company); p.hours += r.hours; hours += r.hours;
    }
  }
  const list = [...people.values()];
  return { people: list, both: list.filter(p => p.companies.size > 1).length, hours };
}

function removeFile(id) {
  const f = S.files.find(x => x.id === id);
  if (!f) return;
  S.files = S.files.filter(x => x.id !== id);
  delete S.pendingBufs[id];
  for (const k in S.payroll) if (S.payroll[k].fileId === id) delete S.payroll[k];
  if (S.hr && S.hr.fileId === id) S.hr = null;

/* ---------- derived facts about the loaded files ---------- */
function coverage() {
  const cells = { AS: {}, BX: {} };
  for (const k in S.payroll) {
    const p = S.payroll[k];
    const diff = p.totalsHours == null ? null : p.parsedHours - p.totalsHours;
    cells[p.company][p.month] = { rows: p.rows.length, diff, ok: diff != null && Math.abs(diff) < 0.01 };
  }
  const months = Object.values(S.payroll).map(p => p.month);
  const lo = months.length ? Math.min(...months) : 0, hi = months.length ? Math.max(...months) : 0;
  const now = new Date(), cur = S.year === now.getFullYear() ? now.getMonth() + 1 : S.year < now.getFullYear() ? 13 : 0;
  return { cells, lo, hi, cur };
}

function warnings() {
  const out = [];
  const { cells, lo, hi } = coverage();
  const M = C.MONTHS;
  if (lo) for (let m = lo; m <= hi; m++) {
    const a = cells.AS[m], b = cells.BX[m];
    if (!a && !b) out.push(['bad', 'No payroll for ' + M[m - 1] + ' from either company, but there are files either side of it. Totals and averages will count it as an empty month.']);
    else if (a && !b) out.push(['warn', M[m - 1] + ' has an AS file but no BX file.']);
    else if (!a && b) out.push(['warn', M[m - 1] + ' has a BX file but no AS file.']);
  }
  for (const k in S.payroll) {
    const p = S.payroll[k], f = S.files.find(x => x.id === p.fileId), label = f ? f.name : k;
    if (p.totalsHours == null) out.push(['warn', label + ' has no Totals row, so its hours could not be checked.']);
    else if (Math.abs(p.parsedHours - p.totalsHours) >= 0.01) out.push(['warn', label + ': the employee rows add up to ' + fmtH(p.parsedHours) + ' hours but the Totals row says ' + fmtH(p.totalsHours) + ' (' + (p.parsedHours > p.totalsHours ? '+' : '') + fmtH(p.parsedHours - p.totalsHours) + '). A row may have been added or removed after the totals were worked out.']);
    const miss = p.missing.filter(x => ['aka', 'dept', 'rate', 'cost', 'surname', 'name'].includes(x));
    if (miss.includes('aka')) out.push(['warn', label + ' has no Α.Κ.Α. column. People in it can\'t be linked to their other company or to the HR workbook by Α.Κ.Α.']);
    const other = miss.filter(x => x !== 'aka');
    if (other.length) out.push(['info', label + ' has no ' + other.map(x => ({ dept: 'Dept.', rate: 'RATE', cost: 'ΚΟΣΤΟΣ', surname: 'Surname', name: 'Name' }[x])).join(', ') + ' column.']);
  }
  if (!S.hr) out.push(['info', 'No hirings & departures workbook yet. Everything about hours works without it; Status, In & Out and Manpower need it.']);
  else {
    const mh = S.hr.missing.hires.filter(k => !['am', 'aka', 'hired'].includes(k)), me = S.hr.missing.exits.filter(k => !['date', 'am', 'aka', 'logos'].includes(k));
    if (mh.length || me.length) out.push(['info', 'The HR workbook is missing some optional columns: ' + [...mh.map(k => 'ΠΡΟΣΛΗΨΕΙΣ ' + k), ...me.map(k => 'ΠΑΡΑΙΤΗΣΕΙΣ ' + k)].join(', ') + '.']);
  }
  const pend = S.files.filter(f => f.status === 'pending').length;
  if (pend) out.unshift(['warn', plural(pend, 'payroll file needs', 'payroll files need') + ' a month and company before it can be counted.']);
  const unk = S.files.filter(f => f.status === 'unknown');
  unk.forEach(f => out.push(['warn', f.name + ' was not recognised: it has no Print sheet, and not the sheets of the HR or manpower workbooks.']));
  return out;
}

const STATUS_OPTS = [['', 'All'], ['active', 'Active'], ['transferred', 'Transferred'], ['left', 'Left the group'], ['resigned', 'Resigned'],
  ['contract', 'Contract ended'], ['dismissed', 'Dismissed'], ['otherdec', 'Other / deceased'], ['nohr', 'No HR record']];
function statusMatch(p, s) {
  if (!s) return true;
  if (s === 'left') return p.left;
  if (s === 'otherdec') return p.status === 'other' || p.status === 'deceased';
  return p.status === s;
}
function period() { return MD().period[S.f.co]; }

  const per = MD().period.Both;

  return words.every(w => p.search.includes(w));

// Hours of one person inside a company and department scope
function calc(p, co, dept) {
  const m = new Array(13).fill(0), c = new Array(13).fill(0), by = { AS: new Array(13).fill(0), BX: new Array(13).fill(0) };
  let any = false;
  for (const r of p.rows) {
    if (co !== 'Both' && r.co !== co) continue;
    if (dept && r.dept !== dept) continue;
    m[r.m] += r.h; c[r.m] += r.c; by[r.co][r.m] += r.h; any = true;
  }
  return { m, c, by, any };
}
function summarise(x, per, basis) {
  let total = 0, cost = 0, worked = 0, best = 0, bestM = 0;
  for (const k of per) { total += x.m[k]; cost += x.c[k]; if (x.m[k] > 0) worked++; if (x.m[k] > best) { best = x.m[k]; bestM = k; } }
  const avg = basis === 'all' ? (per.length ? total / per.length : 0) : (worked ? total / worked : 0);
  return { total, cost, worked, avg, best, bestM };
}
let _scopeCache = null;
function scoped(opts = {}) {
  const sig = JSON.stringify([S.f, opts, S.model && S.model.asOf, S.modelVersion]);

  const per = period(), fm = focusMonth();
  const list = [];
  let hrOnly = 0;
  for (const p of MD().people) {
    if (!p.onPayroll) { hrOnly++; continue; }
    if (!opts.ignoreStatus && MD().hasHR && !statusMatch(p, S.f.status)) continue;
    const x = calc(p, S.f.co, opts.ignoreDept ? '' : S.f.dept);
    if (!x.any) continue;
    if (!opts.ignoreSearch && !matchesQuery(p, S.f.q)) continue;
    const s = summarise(x, per, S.f.basis);
    list.push(Object.assign({ p, x, focus: x.m[fm], focusCost: x.c[fm] }, s));
  }
  const v = { list, per, fm, hrOnly };
  _scopeCache = { sig, model: S.model, v };
  return v;
}

/* ---------- charts (SVG drawn at the container's real width) ---------- */
const CHARTS = {};
function chartBox(key, h, fn) { CHARTS[key] = fn; return `<div class="chart" data-chart="${key}" style="height:${h}px"></div>`; }

// Round gridlines, 3–6 of them, with the least empty space above the data
function niceScale(max) {
  if (!(max > 0)) return { top: 1, step: 0.25 };
  const pow = Math.pow(10, Math.floor(Math.log10(max)));
  let best = null;
  for (const base of [pow / 10, pow]) for (const m of [1, 2, 2.5, 5]) {
    const step = base * m, n = Math.ceil(max / step);
    if (n < 3 || n > 6) continue;
    if (!best || n * step < best.top) best = { top: n * step, step };
  }
  return best || { top: Math.ceil(max / pow) * pow, step: pow };
}
// Monthly bars; series stacked. opts: per, series[{label, color, values}], focus, avg, avgLabel
function monthBars(opts) {
  return (w, h) => {
    const { per, series, focus, avg } = opts;
    const L = 46, R = 10, T = 12, B = 24, iw = w - L - R, ih = h - T - B;
    const sums = per.map(m => series.reduce((s, x) => s + (x.values[m] || 0), 0));
    const sc = niceScale(Math.max(...sums, avg || 0));
    const y = v => T + ih - v / sc.top * ih;
    const band = iw / Math.max(1, per.length), bw = Math.min(46, band * 0.62);
    let g = '';
    for (let v = 0; v <= sc.top + 1e-9; v += sc.step) g += `<line x1="${L}" x2="${w - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 7}" y="${y(v) + 3.5}" class="ax" text-anchor="end">${fmtK(v)}</text>`;
    per.forEach((m, i) => {
      const cx = L + band * i + band / 2;
      if (m === focus) g += `<rect x="${L + band * i + 1}" y="${T}" width="${band - 2}" height="${ih}" class="focus-band"/>`;
      let acc = 0, parts = [];
      series.forEach(s => {
        const v = s.values[m] || 0; if (!v) return;
        g += `<rect x="${cx - bw / 2}" y="${y(acc + v)}" width="${bw}" height="${Math.max(0.5, y(acc) - y(acc + v))}" style="fill:${s.color}"/>`;
        acc += v; parts.push(s.label + ' ' + fmtH(v));
      });
      if (opts.topLabels && opts.topLabels[m] && band >= 44) g += `<text x="${cx}" y="${y(acc) - 6}" class="ax bar-l" text-anchor="middle">${esc(opts.topLabels[m])}</text>`;
      const tip = C.MONTHS[m - 1] + ': ' + fmtH(sums[i]) + ' h' + (series.length > 1 && parts.length ? '\n' + parts.join('\n') : '') + (opts.tipExtra && opts.tipExtra[m] ? '\n' + opts.tipExtra[m] : '');
      g += `<rect x="${L + band * i}" y="${T}" width="${band}" height="${ih}" class="hit" data-tip="${esc(tip)}"/>`;
      g += `<text x="${cx}" y="${h - 7}" class="ax${m === focus ? ' ax-focus' : ''}" text-anchor="middle">${C.MON[m - 1]}</text>`;
    });
    if (avg) g += `<line x1="${L}" x2="${w - R}" y1="${y(avg)}" y2="${y(avg)}" class="avg"/>` + (opts.avgInLegend ? '' : `<text x="${w - R - 2}" y="${y(avg) - 5}" class="ax avg-l" text-anchor="end">${esc(opts.avgLabel || 'Average')} ${fmtH(Math.round(avg))}</text>`);
    return `<svg width="${w}" height="${h}" role="img" aria-label="${esc(opts.label || 'Hours per month')}">${g}</svg>`;
  };
}
function lineChart(opts) {
  return (w, h) => {
    const { per, series, focus } = opts;
    const L = 46, R = 14, T = 12, B = 24, iw = w - L - R, ih = h - T - B;
    const sc = niceScale(Math.max(1, ...series.flatMap(s => per.map(m => s.values[m] || 0))));
    const y = v => T + ih - v / sc.top * ih;
    const x = i => per.length === 1 ? L + iw / 2 : L + iw * i / (per.length - 1);
    let g = '';
    for (let v = 0; v <= sc.top + 1e-9; v += sc.step) g += `<line x1="${L}" x2="${w - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 7}" y="${y(v) + 3.5}" class="ax" text-anchor="end">${fmtK(v)}</text>`;

    per.forEach((m, i) => {
      const tip = C.MONTHS[m - 1] + '\n' + series.map(s => s.label + ': ' + fmtH(s.values[m] || 0) + ' h').join('\n');
      g += `<rect x="${x(i) - band / 2}" y="${T}" width="${band}" height="${ih}" class="hit" data-tip="${esc(tip)}"/>`;
    });
    return `<svg width="${w}" height="${h}" role="img" aria-label="${esc(opts.label || 'Comparison')}">${g}</svg>`;
  };
}
function spark(values, per, w = 84, h = 22) {
  const vs = per.map(m => values[m] || 0), max = Math.max(...vs);
  if (!(max > 0) || per.length < 2) return '<span class="muted">–</span>';
  const pts = vs.map((v, i) => (2 + (w - 4) * i / (vs.length - 1)).toFixed(1) + ',' + (h - 2 - (h - 4) * v / max).toFixed(1));
  const [lx, ly] = pts[pts.length - 1].split(',');
  return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts.join(' ')}"/><circle cx="${lx}" cy="${ly}" r="2"/></svg>`;
}
function kpiBars(values, per, fm) {
  const w = 104, h = 44, n = per.length, max = Math.max(...per.map(k => values[k] || 0));
  if (!(max > 0) || n < 2) return '';
  const bw = (w - (n - 1) * 3) / n;
  return `<svg class="kpi-spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${per.map((k, i) => { const bh = Math.max(1.5, (h - 2) * (values[k] || 0) / max); return `<rect class="kbar${k === fm ? ' on' : ''}" x="${(i * (bw + 3)).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5"/>`; }).join('')}</svg>`;
}
function hbars(items, max) {
  return `<div class="hbars">${items.map(it => `<div class="hb"${it.person != null ? ` data-person="${it.person}"` : ''}>
    <div class="hb-l"><span class="hb-name">${it.label}</span><span class="hb-v">${it.value}</span></div>
    <div class="hb-bar"><i style="width:${max ? (100 * it.raw / max).toFixed(1) : 0}%"></i>${it.mark != null && max ? `<b style="left:${(100 * it.mark / max).toFixed(1)}%" title="${esc(it.markTip || '')}"></b>` : ''}</div>
    ${it.sub ? `<div class="hb-sub">${it.sub}</div>` : ''}</div>`).join('')}</div>`;
}
function companySeries(by, co) {
  const s = [];
  if (co !== 'BX') s.push({ label: 'AS', color: 'var(--as)', values: by.AS });
  if (co !== 'AS') s.push({ label: 'BX', color: 'var(--bx)', values: by.BX });
  return s;
}
function emptyState(title, body, act) {
  return `<div class="empty"><h3>${title}</h3><p>${body}</p>${act || ''}</div>`;
}
function noPayroll() { return emptyState('No payroll files yet', 'Add the AS and BX monthly exports on the Files tab to see hours.', '<button class="btn primary" data-view="files">Go to Files</button>'); }
function nobody() { return emptyState('Nobody matches these filters', 'Loosen the filters above, or clear them.', `<button class="btn" data-act="clear-filters">Clear ${plural(activeFilterCount(), 'filter')}</button>`); }
function hrOnlyNote(v) {

}

/* ================================================================ OVERVIEW */
function renderOverview() {
  const md = MD();
  if (!md.period.Both.length) return noPayroll();
  const v = scoped(), per = v.per, fm = v.fm;
  if (!v.list.length) return head('Overview', '') + nobody();
  const mT = new Array(13).fill(0), mC = new Array(13).fill(0), mP = new Array(13).fill(0), by = { AS: new Array(13).fill(0), BX: new Array(13).fill(0) };
  const dept = {};
  for (const r of v.list) {
    for (const k of per) { mT[k] += r.x.m[k]; mC[k] += r.x.c[k]; if (r.x.m[k] > 0) mP[k]++; by.AS[k] += r.x.by.AS[k]; by.BX[k] += r.x.by.BX[k]; }
    for (const row of r.p.rows) {
      if (S.f.co !== 'Both' && row.co !== S.f.co) continue;
      if (S.f.dept && row.dept !== S.f.dept) continue;
      const d = dept[row.dept] || (dept[row.dept] = { total: 0, focus: 0, people: new Set() });
      d.total += row.h; if (row.m === fm) d.focus += row.h; d.people.add(r.p.id);
    }
  }
  const n = per.length;
  const avg = a => per.reduce((s, k) => s + a[k], 0) / n;
  const aT = avg(mT), aC = avg(mC), aP = avg(mP);
  const hpp = mP[fm] ? mT[fm] / mP[fm] : 0, aHpp = per.reduce((s, k) => s + (mP[k] ? mT[k] / mP[k] : 0), 0) / n;
  const fName = C.MONTHS[fm - 1];
  const tile = (label, val, cmp, avgTxt, series) => {
    const d = pct(cmp[0], cmp[1]);
    return `<div class="kpi"><div class="kpi-l">${label}</div><div class="kpi-v">${val}</div>
      <div class="kpi-c"><span class="delta ${d > 0.05 ? 'pos' : d < -0.05 ? 'neg' : ''}">${fmtPct(d)}</span> on the average month, ${avgTxt}</div>${series ? kpiBars(series, per, fm) : ''}</div>`;
  };
  const deptList = Object.entries(dept).sort((a, b) => b[1].total - a[1].total).slice(0, 8);
  const dMax = deptList.length ? deptList[0][1].total : 0;
  const top = [...v.list].sort((a, b) => b.total - a.total).slice(0, 15);
  const groupDesc = [S.f.co === 'Both' ? 'AS and BX' : S.f.co, S.f.dept, S.f.status && md.hasHR ? STATUS_OPTS.find(o => o[0] === S.f.status)[1].toLowerCase() : '', S.f.q ? 'matching “' + S.f.q + '”' : ''].filter(Boolean).join(', ');

  return head('Overview', `${plural(v.list.length, 'person', 'people')} (${esc(groupDesc)}), ${esc(monthRange(per))} ${md.year}. ${fmtH(per.reduce((s, k) => s + mT[k], 0))} hours in all.`) + `
    <div class="kpis">
      ${tile('Hours in ' + fName, fmtH(mT[fm]), [mT[fm], aT], fmtH(Math.round(aT)), mT)}
      ${tile('People paid in ' + fName, fmt(mP[fm]), [mP[fm], aP], fmt(aP, 1), mP)}
      ${tile('Hours per person in ' + fName, fmt(hpp, 1), [hpp, aHpp], fmt(aHpp, 1), mT.map((t, k) => mP[k] ? t / mP[k] : 0))}
      ${tile('Cost in ' + fName, '€' + fmt(mC[fm]), [mC[fm], aC], '€' + fmt(aC), mC)}
    </div>
    <div class="ov-grid">
      <div class="panel"><div class="panel-h"><h3>Hours per month</h3><div class="legend-i">${S.f.co === 'Both' ? '<span><i style="background:var(--as)"></i>AS</span><span><i style="background:var(--bx)"></i>BX</span>' : ''}<span><i class="avg-sw"></i>Average month ${fmtH(Math.round(aT))}</span></div></div>
        <div class="panel-b">${chartBox('ov-month', 330, monthBars({ per, series: companySeries(by, S.f.co), focus: fm, avg: aT, avgInLegend: true, topLabels: Object.fromEntries(per.map(k => [k, fmtK(mT[k])])) }))}</div></div>
      <div class="panel"><div class="panel-h"><h3>Busiest departments</h3><span class="small muted">Hours over ${esc(monthRange(per))}</span></div>
        <div class="panel-b">${hbars(deptList.map(([name, d]) => ({ label: esc(name), value: fmtH(d.total) + ' h', raw: d.total, sub: `${plural(d.people.size, 'person', 'people')}, ${fmtH(d.focus)} h in ${esc(fName)}` })), dMax)}</div></div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Top people</h3><div class="head-acts"><span class="small muted">By total hours, ${esc(monthRange(per))}</span><button class="btn sm" data-view="employees">All employees</button></div></div>
      <div class="tbl-wrap"><table class="t top">
        <thead><tr><th class="num rk">#</th><th>Employee</th><th>Department</th>${per.map(k => `<th class="num mcol${k === fm ? ' fcol' : ''}">${C.MON[k - 1]}</th>`).join('')}<th class="num">Average</th><th class="num">Total</th><th>Trend</th></tr></thead>
        <tbody>${top.map((r, i) => `<tr><td class="num rk">${i + 1}</td><td>${personCell(r.p)}</td><td class="small">${esc(r.p.dept)}</td>${per.map(k => `<td class="num mcol${k === fm ? ' fcol' : ''}">${r.x.m[k] ? fmtH(r.x.m[k]) : '<span class="muted">–</span>'}</td>`).join('')}<td class="num">${fmt(r.avg, 1)}</td><td class="num"><b>${fmtH(r.total)}</b></td><td>${spark(r.x.m, per)}</td></tr>`).join('')}</tbody>
      </table></div></div>
    ${hrOnlyNote(v)}`;
}
function head(title, sub, right = '') {
