/* ============================================================== INDIVIDUAL */
function renderIndividual() {
  const md = MD();
  if (!md.people.length) return noPayroll();
  const v = scoped();
  const list = [...v.list].sort((a, b) => b.total - a.total);
  let sel = S.sel != null ? md.people[S.sel] : null;
  if (!sel && list.length) { sel = list[0].p; S.sel = sel.id; }
  const inList = sel && list.some(r => r.p.id === sel.id);
  const item = (p, total, pinned) => `<button class="li${sel && p.id === sel.id ? ' on' : ''}" data-person="${p.id}">
      <span class="li-m"><span class="pn">${esc(p.name || '(no name)')}</span><span class="pc">${chips(p)}</span></span>
      <span class="li-v">${total == null ? '' : fmtH(total)}</span>${pinned ? '<span class="li-pin">Outside the current filters</span>' : ''}</button>`;
  const pinned = sel && !inList ? item(sel, null, true) : '';
  return `<div class="ind">
    <aside class="panel ind-list">
      <div class="panel-h">${searchBox('q-ind', 'Search people')}<span class="small muted">${plural(list.length, 'person', 'people')}, by hours</span></div>
      <div class="li-scroll" id="ind-scroll" data-keep>${pinned}${list.map(r => item(r.p, r.total)).join('') || '<p class="muted small" style="padding:14px">Nobody matches.</p>'}</div>
    </aside>
    <section class="ind-card">${sel ? personCard(sel) : emptyState('Pick a person', 'Choose someone from the list.')}</section>
  </div>`;
}

function personCard(p) {
  const md = MD(), per = period(), fm = focusMonth();
  const x = calc(p, S.f.co, '');
  const s = summarise(x, per, S.f.basis);
  const h = p.hr;
  const inCmp = S.cmp.people.includes(p.id);
  const rate = p.rate ? (Math.abs(p.rate.max - p.rate.min) < 0.005 ? '€' + fmt(p.rate.mean, 2) + ' / h' : '€' + fmt(p.rate.min, 2) + '–' + fmt(p.rate.max, 2) + ' / h') : h && h.rate ? '€' + fmt(h.rate, 2) + ' / h (HR)' : '–';
  const basisTxt = S.f.basis === 'all' ? 'over all ' + per.length + ' months' : 'over ' + plural(s.worked, 'month') + ' worked';
  const d = pct(x.m[fm], s.avg);
  const hasHours = s.total > 0;
  const scopeNote = S.f.co !== 'Both' && p.companies.length > 1 ? `<p class="small muted">Showing ${S.f.co} hours only. Set Company to Both to see all of them.</p>` : '';

  const split = p.companies.length > 1 ? (() => {
    const a = per.reduce((t, k) => t + x.by.AS[k], 0), b = per.reduce((t, k) => t + x.by.BX[k], 0), all = a + b || 1;
    const all2 = calc(p, 'Both', ''), A = per.reduce((t, k) => t + all2.by.AS[k], 0), B = per.reduce((t, k) => t + all2.by.BX[k], 0), T2 = A + B || 1;
    return `<div class="panel ic-split"><div class="panel-h"><h3>Paid by both companies</h3></div><div class="panel-b">
      <div class="split"><i style="width:${(100 * A / T2).toFixed(1)}%;background:var(--as)"></i><i style="width:${(100 * B / T2).toFixed(1)}%;background:var(--bx)"></i></div>
      <dl class="facts"><dt><span class="code as">AS ${esc(p.codes.AS)}</span></dt><dd>${fmtH(A)} h (${(100 * A / T2).toFixed(0)}%)</dd><dt><span class="code bx">BX ${esc(p.codes.BX)}</span></dt><dd>${fmtH(B)} h (${(100 * B / T2).toFixed(0)}%)</dd></dl>
    </div></div>`;
  })() : '';

  return `<div class="card-head">
      <div><h2>${esc(p.name || '(no name)')}</h2>
        <div class="meta">${chips(p)}${badge(p)}</div>
        <dl class="facts inline"><div class="fact"><dt>Department</dt><dd>${esc(p.dept || '–')}${p.depts.length > 1 ? ` <span class="muted">(also ${esc(p.depts.slice(1).join(', '))})</span>` : ''}</dd></div>
          <div class="fact"><dt>Α.Κ.Α.</dt><dd>${esc(p.aka || '–')}</dd></div><div class="fact"><dt>Rate</dt><dd>${rate}</dd></div>${h && h.name && p.onPayroll ? `<div class="fact"><dt>HR name</dt><dd>${esc(h.name)}</dd></div>` : ''}${h ? `<div class="fact"><dt>Division</dt><dd>${esc(h.division || '–')}</dd></div><div class="fact"><dt>Station</dt><dd>${esc(h.station || '–')}</dd></div>` : ''}</dl>
      </div>
      <div class="card-acts"><button class="btn sm" data-act="${inCmp ? 'cmp-remove' : 'cmp-add'}" data-id="${p.id}" ${!inCmp && S.cmp.people.length >= 6 ? 'disabled title="Compare holds 6 people"' : ''}>${inCmp ? 'Remove from compare' : 'Add to compare'}</button></div>
    </div>
    ${hasHours ? `<div class="kpis">
      <div class="kpi"><div class="kpi-l">${esc(C.MONTHS[fm - 1])}</div><div class="kpi-v">${fmtH(x.m[fm])} h</div><div class="kpi-c"><span class="delta ${d > 0.05 ? 'pos' : d < -0.05 ? 'neg' : ''}">${fmtPct(d)}</span> on their average</div></div>
      <div class="kpi"><div class="kpi-l">Average</div><div class="kpi-v">${fmt(s.avg, 1)} h</div><div class="kpi-c">${esc(basisTxt)}</div></div>
      <div class="kpi"><div class="kpi-l">Total</div><div class="kpi-v">${fmtH(s.total)} h</div><div class="kpi-c">${esc(monthRange(per))}, €${fmt(s.cost)} cost</div></div>
      <div class="kpi"><div class="kpi-l">Busiest month</div><div class="kpi-v">${esc(C.MONTHS[s.bestM - 1] || '–')}</div><div class="kpi-c">${fmtH(s.best)} h</div></div>
    </div>
    <div class="panel ic-chart"><div class="panel-h"><h3>Hours per month</h3>${p.companies.length > 1 && S.f.co === 'Both' ? '<div class="legend-i"><span><i style="background:var(--as)"></i>AS</span><span><i style="background:var(--bx)"></i>BX</span></div>' : ''}</div>
      <div class="panel-b">${chartBox('ind-' + p.id, 220, monthBars({ per, series: companySeries(x.by, S.f.co), focus: fm, avg: s.avg, avgLabel: 'Their average' }))}${scopeNote}</div></div>`
    : `<div class="note info">${ICON.info}<span>No payroll hours for ${S.f.co === 'Both' ? 'this person' : 'this person in ' + S.f.co} in the loaded files.</span></div>`}

function hrPanel(p) {
  const md = MD();
  if (!md.hasHR) return `<div class="note info">${ICON.info}<span>Add the hirings & departures workbook to see status, hire dates and length of service.</span></div>`;
  const h = p.hr;
  if (!h) return `<div class="panel ic-hr"><div class="panel-h"><h3>HR record</h3>${badge(p)}</div><div class="panel-b"><p>This person is in the payroll files but not in the hirings & departures workbook: no row there carries their Α.Κ.Α. (${esc(p.aka || 'none on payroll')}) or their employee code.</p></div></div>`;
  const nSp = h.spells.length;
  const lastSpell = h.spells[nSp - 1];
  const hired = h.firstHire == null ? 'Before the hirings sheet starts' : fmtD(h.firstHire) + (nSp > 1 ? ` <span class="muted">first of ${nSp} spells; latest ${fmtD(lastSpell.start)}</span>` : '');
  const served = h.served == null ? '–' : fmtDur(h.served) + (h.gap > 30 ? ` <span class="muted">over ${plural(nSp, 'spell')}, ${fmtDur(h.gap)} away</span>` : '');
  const L = h.lastLeave;
  const ageAtExit = L && h.dob != null ? Math.floor((L.date - h.dob) / 365.2425) : null;
  const facts = [
    ['Division', esc(h.division || '–')], ['Station', esc(h.station || '–')], ['Hired', hired], ['Served', served],
    ['Age', p.age == null ? '–' : p.age + (ageAtExit != null && ageAtExit !== p.age ? ` <span class="muted">${ageAtExit} when they left</span>` : '')],
    ['Nationality', esc(h.nat || '–')],
  ];
  if (L) facts.push(['Last day', fmtD(L.date)], ['How it ended', esc(M_.KIND_LABEL[L.kind])],
    ['Reasons given', L.reasons.length ? L.reasons.map(n => `<span class="reason">${n}. ${esc(M_.REASONS[n])}</span>`).join('') : '–'],
    ['Leave settled', L.leaveDays == null && L.leaveAmt == null ? '–' : (L.leaveDays != null ? plural(L.leaveDays, 'day') : '') + (L.leaveAmt != null ? (L.leaveDays != null ? ', ' : '') + '€' + fmt(L.leaveAmt, 2) : '')],
    ['Kit returned', esc(L.kit || '–')]);
  if (h.future.length) facts.push(['Leaving', h.future.map(e => fmtD(e.date) + ' <span class="muted">' + esc(M_.KIND_LABEL[e.kind]) + ', filed in advance</span>').join('<br>')]);
  const evLabel = ev => {
    if (ev.code === 'h') return 'Hired' + (ev.fromExit ? ' <span class="muted">(date taken from a departure row)</span>' : '');
    if (ev.code === 'm') return 'Moved in from another group company';
    if (ev.code === 't') return 'Moved out to another group company';
    return 'Left: ' + esc(M_.KIND_LABEL[ev.kind]);
  };
  const tl = h.events.map(ev => {
    const fut = ev.d > md.asOf;
    const place = [ev.division, ev.station].filter(Boolean).join(', ');
    const e = ev.exit;
    const extra = e ? [e.reasons.length ? e.reasons.map(n => esc(M_.REASONS[n])).join('; ') : '', e.note ? '“' + esc(e.note) + '”' : '', ev.servedAt != null ? 'served ' + fmtDur(ev.servedAt) + ' by then' : ''].filter(Boolean).join('. ') : '';
    return `<li class="ev k-${ev.code}${fut ? ' fut' : ''}"><span class="ev-date">${fmtD(ev.d)}</span><span class="ev-what">${evLabel(ev)}${fut ? ' <span class="muted">(not yet)</span>' : ''}${place ? `<span class="ev-sub">${esc(place)}</span>` : ''}${extra ? `<span class="ev-sub">${extra}</span>` : ''}</span></li>`;
  }).join('');
  const spells = nSp > 1 ? `<div class="sub-h">Spells of employment</div><ol class="spells">${h.spells.map(sp => `<li>${fmtD(sp.start)} to ${sp.end == null ? 'now' : fmtD(sp.end)} <span class="muted">${fmtDur((sp.end == null ? md.asOf : sp.end) - sp.start)}</span></li>`).join('')}</ol>` : '';
  const rec = h.recoveredRows ? `<p class="small muted">${plural(h.recoveredRows, 'row')} of this record had no Α.Κ.Α. and ${h.recoveredRows === 1 ? 'was' : 'were'} matched by name.</p>` : '';
  return `<div class="panel ic-hr"><div class="panel-h"><h3>HR record</h3>${badge(p)}</div><div class="panel-b hr-grid">
    <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    <div><div class="sub-h">Timeline</div><ol class="timeline">${tl || '<li class="muted">No dated events.</li>'}</ol>${spells}${rec}</div>
  </div></div>`;
}

/* ================================================================ COMPARE */
function renderCompare() {
  const md = MD();
  if (!md.period.Both.length) return noPayroll();
  const per = period(), fm = focusMonth(), mode = S.cmp.mode;
  const series = [];
  if (mode === 'people') {
    S.cmp.people = S.cmp.people.filter(id => md.people[id]);
    S.cmp.people.forEach((id, i) => {
      const p = md.people[id], x = calc(p, S.f.co, S.f.dept), s = summarise(x, per, S.f.basis);
      series.push({ key: id, label: p.name, sub: chips(p), color: COLORS[i], values: x.m, s });
    });
  } else {
    const base = scoped({ ignoreDept: true, ignoreSearch: true });
    S.cmp.depts.forEach((d, i) => {
      const m = new Array(13).fill(0), c = new Array(13).fill(0); let ppl = new Set();
      for (const r of base.list) for (const row of r.p.rows) {
        if (row.dept !== d || (S.f.co !== 'Both' && row.co !== S.f.co)) continue;
        m[row.m] += row.h; c[row.m] += row.c; ppl.add(r.p.id);
      }
      series.push({ key: d, label: d, sub: `<span class="small muted">${plural(ppl.size, 'person', 'people')}</span>`, color: COLORS[i], values: m, s: summarise({ m, c }, per, S.f.basis) });
    });
  }
  const full = series.length >= 6;
  const chipsHTML = series.map(s => `<span class="cchip"><i style="background:${s.color}"></i><span>${esc(s.label)}</span><button data-act="cmp-drop" data-key="${esc(s.key)}" aria-label="Remove ${esc(s.label)}">×</button></span>`).join('');
  let adder;
  if (mode === 'people') {
    const q = S.cmpQ.trim();
    const pool = scoped({ ignoreSearch: true }).list.filter(r => !S.cmp.people.includes(r.p.id));
    const hits = (q ? pool.filter(r => matchesQuery(r.p, q)) : [...pool].sort((a, b) => b.total - a.total)).slice(0, 8);
    adder = `<div class="adder"><label class="sr" for="cmp-q">Find a person to add</label><input id="cmp-q" type="search" placeholder="${full ? 'Compare holds 6 people' : 'Find a person to add'}" value="${esc(S.cmpQ)}" ${full ? 'disabled' : ''} autocomplete="off">
      ${!full ? `<div class="hits">${hits.map(r => `<button class="hit-b" data-act="cmp-add" data-id="${r.p.id}"><span class="pn">${esc(r.p.name)}</span><span class="pc">${chips(r.p)}</span><span class="li-v">${fmtH(r.total)}</span></button>`).join('') || '<span class="small muted">Nobody matches.</span>'}</div>` : ''}</div>`;
  } else {
    const avail = (md.depts[S.f.co] || []).filter(d => !S.cmp.depts.includes(d));

function sortedEmployees(cols) {

    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * dir;

}

    </table></div></div>` : nobody()) + hrOnlyNote(v);
}
function csvEmployees() {
  const md = MD();
  const cols = empColumns().filter(c => !c.noCsv);
  const rows = sortedEmployees(cols);
  const extra = [
    ['Α.Κ.Α.', r => r.p.aka || ''], ['Division', r => r.p.hr ? r.p.hr.division : ''], ['Station', r => r.p.hr ? r.p.hr.station : ''],
    ['Age', r => r.p.age == null ? '' : r.p.age], ['Nationality', r => r.p.hr ? r.p.hr.nat : ''],
    ['Average basis', () => S.f.basis === 'all' ? 'All months' : 'Months worked'], ['Company scope', () => S.f.co],
  ].filter(([k]) => md.hasHR || !['Division', 'Station', 'Age', 'Nationality'].includes(k));
  const header = [...cols.map(c => c.k === 'focus' ? C.MONTHS[focusMonth() - 1] + ' (month in focus)' : c.csvL || c.l), ...extra.map(e => e[0])];
  const data = rows.map(r => [...cols.map(c => { const v = c.v(r); return c.fcsv ? c.fcsv(v) : v == null ? '' : (typeof v === 'number' ? +v.toFixed(2) : v); }), ...extra.map(e => e[1](r))]);
  downloadCSV('employees-' + md.year + '-' + S.f.co.toLowerCase() + '.csv', header, data);
}
function downloadCSV(name, header, rows) {
  const q = v => { v = v == null ? '' : String(v); return /[",\n\r;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const txt = '\ufeff' + [header, ...rows].map(r => r.map(q).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* ==========================================================================
   inout.js — the In & Out view (§6.2). Inserted into views.js at build time.
   Population figures (headcount, joiners, leavers, turnover) respond only to
   Division. The departure filters and search narrow the analysis below them.
   ========================================================================== */

const TENURE_BANDS = [['Under 1 month', 0, 30.44], ['1–3 months', 30.44, 91.31], ['3–6 months', 91.31, 182.62], ['6–12 months', 182.62, 365.25],
  ['1–2 years', 365.25, 730.5], ['2–5 years', 730.5, 1826.25], ['5 years or more', 1826.25, Infinity]];
const AGE_BANDS = [['Under 21', 0, 21], ['21–29', 21, 30], ['30–39', 30, 40], ['40–49', 40, 50], ['50–59', 50, 60], ['60 and over', 60, 999]];
const KIND_ORDER = ['resigned', 'contract', 'dismissed', 'other', 'deceased'];

function ioBase() {
  const md = MD(), y = md.year, asOf = md.asOf;
  const y0 = C.dayOf(y, 1, 1), yEnd = C.dayOf(y, 12, 31);
  const [ay, am] = C.dayParts(asOf);
  const lastM = y < ay ? 12 : y > ay ? 0 : am;
  const end = Math.min(asOf, yEnd);
  const months = []; for (let m = 1; m <= lastM; m++) months.push(m);
  const events = [], future = [];
  for (const p of md.people) {
    const h = p.hr; if (!h) continue;
    for (const ev of h.events) {
      const division = ev.division || h.division;
      if (ev.d > asOf) { if (ev.code === 'x') future.push({ p, ev, division }); continue; }
      if (ev.d < y0 || ev.d > yEnd) continue;
      events.push({ p, ev, d: ev.d, m: C.dayParts(ev.d)[1], code: ev.code, division });
    }
  }
  const divs = [...new Set(C.DIVS.concat(events.map(e => e.division).filter(Boolean)))];
  return { md, y, asOf, y0, end, months, lastM, events, future, divs };
}
function headcount(md, day, div) {
  let n = 0;
  for (const p of md.people) {
    const h = p.hr;
    if (!h || p.ghost || !M_.employedAt(h, day)) continue;
    if (div && M_.postingAt(h, day).division !== div) continue;
    n++;
  }
  return n;
}
const ioStation = ev => ev.station || '(no station)';
function ioDepartures(base) {
  const io = S.io;
  const all = base.events.filter(e => e.code === 'x' && (!io.div || e.division === io.div));
  const shown = all.filter(e => (!io.station || ioStation(e.ev) === io.station) && (!io.month || e.m === io.month) &&
    (!io.kind || e.ev.kind === io.kind) && (!io.reason || (io.reason === 'none' ? !e.ev.exit.reasons.length : e.ev.exit.reasons.includes(+io.reason))) &&
    matchesQuery(e.p, S.f.q));
  return { all, shown };
}
const ageAt = (p, d) => p.hr && p.hr.dob != null ? Math.floor((d - p.hr.dob) / 365.2425) : null;
function bandCounts(values, bands) {
  const out = bands.map(b => ({ label: b[0], n: 0 })); let unknown = 0;
  for (const v of values) { if (v == null) { unknown++; continue; } const i = bands.findIndex(b => v >= b[1] && v < b[2]); if (i >= 0) out[i].n++; }
  return { out, unknown };
}
function countBars(items, unit = 'departure') {
  const max = Math.max(0, ...items.map(i => i.n)), tot = items.reduce((s, i) => s + i.n, 0);
  if (!tot) return '<p class="muted small">None in this selection.</p>';
  return hbars(items.map(i => ({ label: esc(i.label), value: fmt(i.n) + ' <span class="muted">' + (tot ? Math.round(100 * i.n / tot) : 0) + '%</span>', raw: i.n })), max);
}

function inOutChart(o) {
  return (w, h) => {
    const { months, J, L, MI, MO, partial } = o;
    const Lp = 40, R = 10, T = 16, B = 24, iw = w - Lp - R, ih = h - T - B, mid = T + ih / 2;
    const sc = niceScale(Math.max(1, ...months.map(m => Math.max(J[m] + MI[m], L[m] + MO[m]))));
    const y = v => mid - v / sc.top * (ih / 2 - 8);
    let g = '';
    for (let v = sc.step; v <= sc.top + 1e-9; v += sc.step) {
      g += `<line x1="${Lp}" x2="${w - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><line x1="${Lp}" x2="${w - R}" y1="${y(-v)}" y2="${y(-v)}" class="grid"/>`;
      g += `<text x="${Lp - 7}" y="${y(v) + 3.5}" class="ax" text-anchor="end">${fmt(v)}</text><text x="${Lp - 7}" y="${y(-v) + 3.5}" class="ax" text-anchor="end">${fmt(v)}</text>`;
    }
    const band = iw / Math.max(1, months.length), bw = Math.min(38, band * 0.6);
    months.forEach((m, i) => {
      const cx = Lp + band * i + band / 2, x0 = cx - bw / 2;
      const r = (a, b, cls) => Math.abs(y(a) - y(b)) > 0.2 ? `<rect x="${x0}" y="${Math.min(y(a), y(b))}" width="${bw}" height="${Math.abs(y(a) - y(b))}" class="${cls}"/>` : '';
      g += r(0, J[m], 'b-in') + r(J[m], J[m] + MI[m], 'b-mv') + r(0, -L[m], 'b-out') + r(-L[m], -L[m] - MO[m], 'b-mv');
      if (J[m]) g += `<text x="${cx}" y="${y(J[m] + MI[m]) - 5}" class="ax bar-l" text-anchor="middle">${J[m]}</text>`;
      if (L[m]) g += `<text x="${cx}" y="${y(-L[m] - MO[m]) + 13}" class="ax bar-l" text-anchor="middle">${L[m]}</text>`;
      g += `<text x="${cx}" y="${h - 6}" class="ax" text-anchor="middle">${C.MON[m - 1]}${m === partial ? '*' : ''}</text>`;
      const tip = C.MONTHS[m - 1] + (m === partial ? ' (to date)' : '') + '\nJoined ' + J[m] + '\nLeft ' + L[m] + (MI[m] || MO[m] ? '\nMoved in ' + MI[m] + ', moved out ' + MO[m] + ' (not counted)' : '');
      g += `<rect x="${Lp + band * i}" y="${T}" width="${band}" height="${ih}" class="hit" data-tip="${esc(tip)}"/>`;
    });
    g += `<line x1="${Lp}" x2="${w - R}" y1="${mid}" y2="${mid}" class="zero"/>`;
    return `<svg width="${w}" height="${h}" role="img" aria-label="Joiners and leavers by month">${g}</svg>`;
  };
}

function renderInOut() {
  const base = ioBase(), md = base.md, io = S.io;
  if (!base.months.length) return head('In & Out', '') + emptyState('Nothing to show for ' + md.year, 'In & Out covers the year set on the Files tab, up to today.');
  const div = io.div;
  const partial = base.y === C.dayParts(md.asOf)[0] ? base.lastM : 0;

  // ---- population (Division only)
  const ev = base.events.filter(e => !div || e.division === div);
  const J = new Array(13).fill(0), L = new Array(13).fill(0), MI = new Array(13).fill(0), MO = new Array(13).fill(0);
  ev.forEach(e => { if (e.code === 'h') J[e.m]++; else if (e.code === 'x') L[e.m]++; else if (e.code === 'm') MI[e.m]++; else if (e.code === 't') MO[e.m]++; });
  const joiners = J.reduce((a, b) => a + b, 0), leavers = L.reduce((a, b) => a + b, 0), moves = MI.reduce((a, b) => a + b, 0) + MO.reduce((a, b) => a + b, 0);
  const start = headcount(md, base.y0 - 1, div);
  const hc = new Array(13).fill(null);
  base.months.forEach(m => { hc[m] = headcount(md, Math.min(C.monthEnd(base.y, m), md.asOf), div); });
  const nowHC = hc[base.lastM];
  const avgHC = [start, ...base.months.map(m => hc[m])].reduce((a, b) => a + b, 0) / (base.months.length + 1);
  const days = base.end - base.y0 + 1;
  const ytd = avgHC ? leavers / avgHC : null, annual = ytd == null ? null : ytd * 365 / days;
  const ghostsOut = md.people.filter(p => p.ghost).length;

  // ---- departure analysis (all filters)
  const dep = ioDepartures(base);
  const D = dep.shown;
  const reasonCount = {}; let noReason = 0;
  D.forEach(e => { if (!e.ev.exit.reasons.length) noReason++; e.ev.exit.reasons.forEach(n => reasonCount[n] = (reasonCount[n] || 0) + 1); });
  const reasons = Object.entries(reasonCount).map(([n, c]) => ({ label: n + '. ' + M_.REASONS[n], n: c })).sort((a, b) => b.n - a.n);
  const kinds = KIND_ORDER.map(k => ({ label: M_.KIND_LABEL[k], n: D.filter(e => e.ev.kind === k).length })).filter(k => k.n);
  const stCount = {}; D.forEach(e => { const s = ioStation(e.ev); stCount[s] = (stCount[s] || 0) + 1; });
  const stations = Object.entries(stCount).map(([label, n]) => ({ label, n })).sort((a, b) => b.n - a.n);
  const ten = bandCounts(D.map(e => e.ev.servedAt == null ? null : e.ev.servedAt), TENURE_BANDS);
  const known = D.length - ten.unknown, inside3 = ten.out[0].n + ten.out[1].n;
  const age = bandCounts(D.map(e => ageAt(e.p, e.d)), AGE_BANDS);

  // hours worked by the people who left
  const per = md.period[S.f.co], leftPeople = [...new Map(D.map(e => [e.p.id, e.p])).values()];
  const lh = new Array(13).fill(0), allH = new Array(13).fill(0);
  leftPeople.forEach(p => { const x = calc(p, S.f.co, ''); per.forEach(m => lh[m] += x.m[m]); });
  md.people.forEach(p => { if (!p.onPayroll) return; for (const r of p.rows) if (S.f.co === 'Both' || r.co === S.f.co) allH[r.m] += r.h; });
  const share = {}; per.forEach(m => { share[m] = allH[m] ? (100 * lh[m] / allH[m]).toFixed(1) + '%' : ''; });
  const shareTip = {}; per.forEach(m => { shareTip[m] = share[m] + ' of all ' + fmtH(allH[m]) + ' hours'; });

  // ---- filter bar options
  const stOpts = [...new Set(dep.all.map(e => ioStation(e.ev)))].sort();
  if (io.station && !stOpts.includes(io.station)) io.station = '';
  const depFilters = !!(io.station || io.month || io.kind || io.reason || S.f.q.trim());
  const sel = (key, label, opts, cur) => `<div class="fg"><label class="fl" for="io-${key}">${label}</label><select id="io-${key}" data-io="${key}">${opts.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
  const bar = `<div class="panel io-bar"><div class="io-f">
      ${sel('div', 'Division', [['', 'All divisions'], ...base.divs.map(d => [d, d])], io.div)}
      <div class="io-split" aria-hidden="true"></div>
      ${sel('station', 'Left from', [['', 'Any station'], ...stOpts.map(s => [s, s])], io.station)}
      ${sel('month', 'Left in', [[0, 'Any month'], ...base.months.map(m => [m, C.MONTHS[m - 1]])], io.month)}
      ${sel('kind', 'How it ended', [['', 'Any way'], ...KIND_ORDER.map(k => [k, M_.KIND_LABEL[k]])], io.kind)}
      ${sel('reason', 'Reason given', [['', 'Any reason'], ['none', 'No reason given'], ...Object.keys(M_.REASONS).map(n => [n, n + '. ' + M_.REASONS[n]])], io.reason)}
      <div class="fg grow"><label class="fl" for="q-io">Search departures</label><input id="q-io" data-q type="search" placeholder="Name, code or Α.Κ.Α." value="${esc(S.f.q)}" autocomplete="off"></div>
      <div class="fg"><span class="fl">&nbsp;</span><button class="btn sm" data-act="io-reset" ${depFilters ? '' : 'disabled'}>Reset</button></div>
    </div>
    <p class="io-scope">Division sets the population for every figure on this page. The other filters and the search narrow only the departure analysis, so headcount and turnover always describe the whole ${div ? esc(div) + ' ' : ''}workforce.</p></div>`;
  const mainNote = (S.f.status || S.f.dept) ? `<div class="note info">${ICON.info}<span>The ${[S.f.status ? 'Status' : '', S.f.dept ? 'Department' : ''].filter(Boolean).join(' and ')} filter in the top bar doesn’t apply here: headcount and turnover only mean something for a whole workforce.</span></div>` : '';

  const tile = (l, v, c) => `<div class="kpi"><div class="kpi-l">${l}</div><div class="kpi-v">${v}</div><div class="kpi-c">${c}</div></div>`;
  const yLabel = partial ? C.MON[0] + ' to ' + fmtD(md.asOf) : String(base.y);
  const showing = `<p class="showing">Showing <b>${fmt(D.length)}</b> of ${plural(dep.all.length, 'departure')} in ${esc(yLabel)}${depFilters ? '' : ''}.</p>`;

  const tables = ioTable(base, D);
  const fut = base.future.filter(f => (!div || f.division === div) && matchesQuery(f.p, S.f.q)).sort((a, b) => a.ev.d - b.ev.d);

  return head('In & Out', `Who joined, who left, and how many people there are, ${esc(yLabel)}.${partial ? ' The current month counts up to today.' : ''}`) + bar + mainNote + `
    <div class="kpis">
      ${tile('Headcount', fmt(nowHC), `${fmt(start)} on 1 January, ${nowHC >= start ? '+' : '−'}${fmt(Math.abs(nowHC - start))}`)}
      ${tile('Joiners', fmt(joiners), `hired from outside${moves ? `; ${plural(moves, 'internal move')} not counted` : ''}`)}
      ${tile('Leavers', fmt(leavers), 'left the group')}

/* ==========================================================================
   manpower.js — the Manpower view (§6.3). Inserted into views.js at build time.
   Every figure comes from one walk over the employment records: a month's
   START is the list of people employed the day before it begins, END the list
   employed on its last day (today, for the current month). IN and OUT are the
   difference between the two lists, so END = START + IN − OUT by construction.
   ========================================================================== */

const MP_FIGS = [['start', 'Start'], ['in', 'In'], ['out', 'Out'], ['end', 'End'], ['net', 'Net change']];
const MP_SHEET_OF = { start: 'start', in: 'in', out: 'out', end: 'end' };
const DIV_ORDER = ['AIRPORTS', 'BORDER', 'CYPRUS'];
const mkey = (y, m) => y + '-' + String(m).padStart(2, '0');
const mlabel = k => { const [y, m] = k.split('-').map(Number); return C.MON[m - 1] + ' ' + y; };
const mlabelShort = k => { const [y, m] = k.split('-').map(Number); return C.MON[m - 1] + ' ’' + String(y).slice(2); };

// Station for manpower: the latest hire-row posting on or before the day. Departure
// rows spell stations differently, so they are only used when nothing else exists.
function mpPosting(h, d) {
  let hire = null, any = null;
  for (const p of h.postings) { if (p.d > d) break; if (!(p.division || p.station)) continue; any = p; if (p.src === 'hire') hire = p; }
  return hire || any || h.postings.find(p => p.division || p.station) || { division: h.division, station: h.station };
}

function mpCompute(md) {
  if (md._mp) return md._mp;
  const [ay, am] = C.dayParts(md.asOf), y = md.year;
  const lastM = y < ay ? 12 : y > ay ? 0 : am;
  const months = [];
  for (let yy = y - 3; yy <= y; yy++) for (let m = 1; m <= 12; m++) {
    if (yy === y && m > lastM) break;
    const me = C.monthEnd(yy, m);
    months.push({ key: mkey(yy, m), y: yy, m, s: C.dayOf(yy, m, 1) - 1, e: Math.min(me, md.asOf), partial: me > md.asOf });
  }
  const rows = new Map();
  const blank = () => ({ start: 0, end: 0, joined: 0, movedIn: 0, left: 0, movedOut: 0 });
  const row = (division, station) => {
    division = division || '(no division)'; station = station || '(no station)';
    const k = division + '|' + station;
    let r = rows.get(k);
    if (!r) rows.set(k, r = { key: k, division, station, cells: months.map(blank) });
    return r;
  };
  const place = (h, d) => { const p = mpPosting(h, d); return row(p.division || h.division, p.station || h.station); };
  for (const p of md.people) {
    const h = p.hr;
    if (!h || p.ghost) continue;
    months.forEach((M, i) => {
      const onS = M_.employedAt(h, M.s), onE = M_.employedAt(h, M.e);
      if (!onS && !onE) return;
      const rs = onS ? place(h, M.s) : null, re = onE ? place(h, M.e) : null;
      if (rs) rs.cells[i].start++;
      if (re) re.cells[i].end++;
      if (rs && re) { if (rs !== re) { rs.cells[i].movedOut++; re.cells[i].movedIn++; } }
      else if (re) re.cells[i][h.events.some(ev => ev.code === 'h' && ev.d > M.s && ev.d <= M.e) ? 'joined' : 'movedIn']++;
      else rs.cells[i].left++;
    });
  }
  const list = [...rows.values()].filter(r => r.cells.some(c => c.start || c.end));
  const di = d => { const i = DIV_ORDER.indexOf(d); return i < 0 ? 99 : i; };
  list.sort((a, b) => di(a.division) - di(b.division) || a.division.localeCompare(b.division) ||
    b.cells[b.cells.length - 1].end - a.cells[a.cells.length - 1].end || a.station.localeCompare(b.station));
  // identity checks over every cell
  let cells = 0, breaks = [];
  for (const r of list) r.cells.forEach((c, i) => {
    cells++;
    if (c.end !== c.start + c.joined + c.movedIn - c.left - c.movedOut) breaks.push(r.key + ' ' + months[i].key + ' END');
    if (i && c.start !== r.cells[i - 1].end) breaks.push(r.key + ' ' + months[i].key + ' START');
  });
  md._mp = { months, rows: list, cells, breaks };
  return md._mp;
}
const figOf = (c, fig) => fig === 'start' ? c.start : fig === 'end' ? c.end : fig === 'in' ? c.joined + c.movedIn : fig === 'out' ? c.left + c.movedOut : c.end - c.start;
const sumCells = cs => cs.reduce((a, c) => ({ start: a.start + c.start, end: a.end + c.end, joined: a.joined + c.joined, movedIn: a.movedIn + c.movedIn, left: a.left + c.left, movedOut: a.movedOut + c.movedOut }),
  { start: 0, end: 0, joined: 0, movedIn: 0, left: 0, movedOut: 0 });

/* ---------- the uploaded manpower workbook ---------- */
const stripDiv = (label, div) => { const n = C.normHeader(label), d = C.normHeader(div); return n.startsWith(d + ' ') ? n.slice(d.length + 1) : n; };
function wbRows() {
  const mp = S.mp; if (!mp) return [];
  const out = new Map();
  for (const fig of ['start', 'in', 'out', 'end']) for (const r of (mp.sheets[fig] || [])) {
    if (r.kind !== 'station') continue;
    const k = r.division + '|' + r.label;
    let w = out.get(k); if (!w) out.set(k, w = { key: k, division: r.division, label: r.label, v: {} });
    if (!w.v[fig]) w.v[fig] = r.values;              // first row with this label wins
  }
  return [...out.values()];
}
function wbMapping(rows, comp) {
  if (!S.mpMap) S.mpMap = {};
  for (const w of rows) {
    if (w.key in S.mpMap) continue;
    const want = stripDiv(w.label, w.division), whole = C.normHeader(w.label);
    const hit = comp.find(r => r.division === w.division && (C.normHeader(r.station) === want || C.normHeader(r.station) === whole));
    S.mpMap[w.key] = hit ? hit.key : '';
  }
  return S.mpMap;
}
// workbook value for a computed row, figure and month (sum of rows mapped to it)
function wbValue(wrows, map, compKey, fig, mk) {
  let v = null;
  for (const w of wrows) {
    if (map[w.key] !== compKey) continue;
    const get = f => w.v[f] && w.v[f][mk] != null ? w.v[f][mk] : null;
    const x = fig === 'net' ? (get('end') != null && get('start') != null ? get('end') - get('start') : null) : get(MP_SHEET_OF[fig]);
    if (x != null) v = (v || 0) + x;
  }
  return v;
}
function wbConsistency(wrows) {
  const mp = S.mp, byDiv = {};
  for (const w of wrows) (byDiv[w.division] || (byDiv[w.division] = [])).push(w);
  const out = [];
  for (const div of Object.keys(byDiv).sort((a, b) => (DIV_ORDER.indexOf(a) + 1 || 99) - (DIV_ORDER.indexOf(b) + 1 || 99))) {
    const rs = byDiv[div];
    const tot = (f, mk) => { let s = null; for (const w of rs) { const v = w.v[f] && w.v[f][mk]; if (v != null) s = (s || 0) + v; } return s; };
    const populated = mp.months.filter(mk => tot('end', mk));
    let id1 = 0, id1n = 0, id2 = 0, id2n = 0;
    populated.forEach(mk => {
      const S0 = tot('start', mk), I = tot('in', mk), O = tot('out', mk), E = tot('end', mk);
      if (S0 != null && I != null && O != null) { id1n++; if (Math.abs(E - (S0 + I - O)) > 1e-9) id1++; }
      const [y, m] = mk.split('-').map(Number), prev = m === 1 ? mkey(y - 1, 12) : mkey(y, m - 1);
      const pe = tot('end', prev);
      if (pe && S0 != null) { id2n++; if (Math.abs(S0 - pe) > 1e-9) id2++; }
    });
    // typed TOTAL rows against the sum of their stations (END sheet)
    const totalRow = (mp.sheets.end || []).find(r => r.kind === 'total' && r.division === div);
    let tBad = 0, tN = 0;
    if (totalRow) populated.forEach(mk => { if (totalRow.values[mk] != null) { tN++; if (Math.abs(totalRow.values[mk] - tot('end', mk)) > 1e-9) tBad++; } });
    out.push({ div, populated: populated.length, id1, id1n, id2, id2n, tBad, tN });
  }
  return out;
}

/* ---------- records to fix ---------- */
function recordsToFix(md) {
  const out = [];
  const codes = p => p.codeList.map(c => c.co + ' ' + c.code).join(' / ');
  md.people.filter(p => p.ghost).forEach(p => out.push({ type: 'Probable unfiled departure', p, codes: codes(p), aka: p.aka, name: p.name,
    where: [p.hr.division, p.hr.station].filter(Boolean).join(', '), date: p.hr.lastEventDay,
    detail: 'Hired ' + fmtD(p.hr.latestHire || p.hr.firstHire) + '; nothing on record since ' + fmtD(p.hr.lastEventDay) + ' and no payroll hours. Add the departure, with its Α/Μ and Α.Κ.Α.' }));
  md.people.filter(p => p.onPayroll && !p.hr).forEach(p => out.push({ type: 'On payroll, no HR record', p, codes: codes(p), aka: p.aka, name: p.name,
    where: p.dept, date: null, detail: 'Paid by ' + p.companies.join(' and ') + ' but no hirings or departures row carries this Α.Κ.Α. or code.' }));
  const WHY = { unknown: 'the name is on no other row that has one', ambiguous: 'the name belongs to more than one person', nameless: 'no name either' };
  (md.unplaced || []).forEach(u => out.push({ type: u.sheet === 'hires' ? 'Hiring row not placed' : 'Departure row not placed', p: null,
    codes: u.am ? 'Α/Μ ' + u.am : '', aka: '', name: u.name, where: [u.division, u.station].filter(Boolean).join(', '), date: u.date,
    detail: (u.sheet === 'hires' ? 'ΠΡΟΣΛΗΨΕΙΣ' : 'ΠΑΡΑΙΤΗΣΕΙΣ ΚΑΙ ΜΕΤΑΦΟΡΕΣ') + ' row ' + u.row + ': no Α.Κ.Α., and ' + WHY[u.why] + '. Fill in the Α.Κ.Α. or Α/Μ.' }));
  return out;
}

/* ---------- view ---------- */
function renderManpower() {
  const md = MD(), G = mpCompute(md), v = S.mpv;
  if (!G.months.length) return head('Manpower', '') + emptyState('No months to show', 'The manpower window runs from January ' + (md.year - 3) + ' to today.');
  const keys = G.months.map(m => m.key);
  if (!keys.includes(v.to)) v.to = keys[keys.length - 1];
  if (!keys.includes(v.from)) v.from = keys[Math.max(0, keys.indexOf(v.to) - 11)];
  if (keys.indexOf(v.from) > keys.indexOf(v.to)) v.from = v.to;
  const i0 = keys.indexOf(v.from), i1 = keys.indexOf(v.to), idx = []; for (let i = i0; i <= i1; i++) idx.push(i);
  const hasWb = !!S.mp;
  if (!hasWb && v.mode !== 'computed') v.mode = 'computed';
  const divs = [...new Set(G.rows.map(r => r.division))];
  const wrows = wbRows(), map = hasWb ? wbMapping(wrows, G.rows) : {};
  // rows with nobody in them during the chosen period are hidden (unless the workbook has figures for them)
  const activeIn = r => idx.some(i => { const c = r.cells[i]; return c.start || c.end || c.joined || c.left || c.movedIn || c.movedOut; }) ||
    (hasWb && v.mode !== 'computed' && idx.some(i => wbValue(wrows, map, r.key, v.fig, G.months[i].key)));
  const rows = G.rows.filter(r => (!v.div || r.division === v.div) && activeIn(r));
  const hiddenRows = G.rows.filter(r => (!v.div || r.division === v.div) && !activeIn(r)).length;

  const cellVal = (r, i) => {
    const comp = figOf(r.cells[i], v.fig);
    if (v.mode === 'computed') return { val: comp, comp };
    const wb = r.key ? wbValue(wrows, map, r.key, v.fig, G.months[i].key) : r.wb ? r.wb[i] : null;
    return v.mode === 'workbook' ? { val: wb, comp, wb } : { val: wb == null ? null : comp - wb, comp, wb };
  };
  const periodVal = cellsArr => {
    const c = cellsArr;
    if (v.fig === 'start') return figOf(c[0], 'start');
    if (v.fig === 'end') return figOf(c[c.length - 1], 'end');
    return c.reduce((s, x) => s + figOf(x, v.fig), 0);
  };
  const tipFor = (label, i, c, wb) => {
    let t = label + ', ' + mlabel(G.months[i].key) + (G.months[i].partial ? ' (to date)' : '') +
      '\nStart ' + c.start + '\nJoined ' + c.joined + '\nMoved in ' + c.movedIn + '\nLeft ' + c.left + '\nMoved out ' + c.movedOut + '\nEnd ' + c.end;
    if (wb) t += '\nWorkbook: start ' + (wb.start ?? '–') + ', in ' + (wb.in ?? '–') + ', out ' + (wb.out ?? '–') + ', end ' + (wb.end ?? '–');
    return t;
  };
  const wbAll = (key, i) => hasWb ? { start: wbValue(wrows, map, key, 'start', G.months[i].key), in: wbValue(wrows, map, key, 'in', G.months[i].key), out: wbValue(wrows, map, key, 'out', G.months[i].key), end: wbValue(wrows, map, key, 'end', G.months[i].key) } : null;
  const fmtCell = (x, isDiff) => x == null ? '<span class="muted">–</span>' : isDiff ? (x === 0 ? '<span class="muted">0</span>' : (x > 0 ? '+' : '−') + fmt(Math.abs(x))) : (x === 0 ? '<span class="muted">0</span>' : fmt(x));
  const diffCls = x => v.mode === 'diff' && x != null && x !== 0 ? (x > 0 ? ' d-pos' : ' d-neg') : '';

  // group rows with subtotals
  const groups = [];
  for (const d of divs) { const rs = rows.filter(r => r.division === d); if (rs.length) groups.push({ d, rs }); }
  const sumRow = (rs, label) => {
    const cells = G.months.map((_, i) => sumCells(rs.map(r => r.cells[i])));
    const wb = hasWb ? G.months.map((_, i) => { let s = null; for (const r of rs) { const x = wbValue(wrows, map, r.key, v.fig, G.months[i].key); if (x != null) s = (s || 0) + x; } return s; }) : null;
    return { label, cells, wb, key: null };
  };
  let body = '';
  const renderRow = (r, cls, label) => {
    const tds = idx.map(i => {
      const cv = cellVal(r, i);
      const wb = r.key ? wbAll(r.key, i) : null;
      return `<td class="num${diffCls(cv.val)}${G.months[i].partial ? ' part' : ''}" data-tip="${esc(tipFor(label, i, r.cells[i], wb))}">${fmtCell(cv.val, v.mode === 'diff')}</td>`;
    }).join('');
    const pc = v.mode === 'computed' ? fmtCell(periodVal(idx.map(i => r.cells[i]))) : '';
    return `<tr class="${cls}"><th scope="row">${label}</th>${tds}<td class="num per">${pc}</td></tr>`;
  };
  for (const g of groups) {
    body += `<tr class="grp"><th colspan="${idx.length + 2}">${esc(g.d)}</th></tr>`;
    g.rs.forEach(r => body += renderRow(r, '', esc(r.station)));
    body += renderRow(sumRow(g.rs, g.d + ' total'), 'sub', esc(g.d) + ' total');
  }
  const grand = sumRow(rows, 'All');
  body += renderRow(grand, 'grand', v.div ? esc(v.div) + ', all stations' : 'All divisions');

  // turnover rows for the grand total of the selection
  const T = idx.map(i => grand.cells[i]);
  const tRow = (label, fn, tip) => `<tr class="tov"><th scope="row" title="${esc(tip)}">${label}</th>${T.map(c => { const x = fn(c); return `<td class="num">${x == null ? '–' : (100 * x).toFixed(1) + '%'}</td>`; }).join('')}<td class="num per"></td></tr>`;
  const tov = tRow('Turnover, ÷ end of month', c => c.end ? c.left / c.end : null, 'The workbook’s way: leavers divided by the headcount at the end of the month') +
    tRow('Turnover, ÷ average', c => (c.start + c.end) ? c.left / ((c.start + c.end) / 2) : null, 'The usual way: leavers divided by the average of opening and closing headcount') +
    tRow('Retention', c => (c.start + c.end) ? 1 - c.left / ((c.start + c.end) / 2) : null, '1 − turnover (÷ average)');

  const figSeg = `<div class="seg" role="group">${MP_FIGS.map(([k, l]) => `<button data-act="mp-fig" data-v="${k}" aria-pressed="${v.fig === k}">${l}</button>`).join('')}</div>`;
  const modeSeg = hasWb ? `<div class="fg"><span class="fl">Show</span><div class="seg" role="group">${[['computed', 'Computed'], ['workbook', 'Workbook'], ['diff', 'Difference']].map(([k, l]) => `<button data-act="mp-mode" data-v="${k}" aria-pressed="${v.mode === k}">${l}</button>`).join('')}</div></div>` : '';
  const opt = (k, cur) => `<option value="${k}"${k === cur ? ' selected' : ''}>${mlabel(k)}</option>`;
  const controls = `<div class="panel io-bar"><div class="io-f">
    <div class="fg"><label class="fl" for="mp-from">From</label><select id="mp-from" data-mp="from">${keys.map(k => opt(k, v.from)).join('')}</select></div>
    <div class="fg"><label class="fl" for="mp-to">To</label><select id="mp-to" data-mp="to">${keys.map(k => opt(k, v.to)).join('')}</select></div>
    <div class="fg"><label class="fl" for="mp-div">Division</label><select id="mp-div" data-mp="div"><option value="">All divisions</option>${divs.map(d => `<option${d === v.div ? ' selected' : ''}>${esc(d)}</option>`).join('')}</select></div>
    <div class="fg"><span class="fl">Figure</span>${figSeg}</div>
    ${modeSeg}
    <div class="fg"><span class="fl">&nbsp;</span><button class="btn sm" data-act="mp-csv">Download CSV</button></div>
  </div></div>`;
  const nChecked = rows.length * G.months.length;
  const ok = !G.breaks.length;
  const check = `<div class="note ${ok ? 'good' : 'bad'}">${ok ? ICON.check : ICON.warn}<span>${ok
    ? `Checked all ${fmt(G.cells)} station-months across the whole window: END = START + IN − OUT and START = last month’s END hold in every one.`
    : `${plural(G.breaks.length, 'identity break')} found, for example ${esc(G.breaks.slice(0, 3).join(', '))}. This should not be possible; please report it.`}</span></div>`;

  const modeNote = v.mode === 'workbook' ? '<p class="small muted">Showing the workbook’s own figures, placed against the computed rows through the station mapping below. Hover a cell to see both.</p>'
    : v.mode === 'diff' ? '<p class="small muted">Computed minus workbook. Green means the records show more than the workbook; red means fewer. Hover a cell to see both.</p>' : '';

  const grid = `<div class="panel"><div class="tbl-wrap mp-wrap" id="mp-scroll" data-keep><table class="t mp">
      <thead><tr><th scope="col">${esc(MP_FIGS.find(f => f[0] === v.fig)[1])}${v.mode === 'diff' ? ', difference' : v.mode === 'workbook' ? ', workbook' : ''}</th>${idx.map(i => `<th class="num" scope="col">${mlabelShort(G.months[i].key)}${G.months[i].partial ? '*' : ''}</th>`).join('')}<th class="num per" scope="col">${v.mode === 'computed' ? 'Period' : ''}</th></tr></thead>
      <tbody>${body}</tbody><tbody class="tov-b">${tov}</tbody></table></div>
    <div class="panel-foot small muted">Rows are division and station of each person’s posting on that day. In and out count joiners and people moving in, leavers and people moving out; a move between stations or companies is never a joiner or a leaver. Someone who joins and leaves inside the same month appears in neither.${G.months.some(m => m.partial) ? ' * The current month runs to today.' : ''} Turnover counts leavers only.${hiddenRows ? ' ' + plural(hiddenRows, 'station row') + ' with nobody in ' + (hiddenRows === 1 ? 'it' : 'them') + ' during this period ' + (hiddenRows === 1 ? 'is' : 'are') + ' hidden.' : ''}</div></div>`;

  return head('Manpower', 'Headcount by station and month, worked out from the employment records rather than typed.') + controls + check + modeNote + grid +
    (hasWb ? workbookPanels(wrows, map, G) : `<div class="note info">${ICON.info}<span>Add the manpower workbook (sheets START OF MONTH, IN, OUT, END OF MONTH) on the Files tab to compare it with these figures.</span></div>`) +
    trustPanel(md, G);
}

function workbookPanels(wrows, map, G) {
  const cons = wbConsistency(wrows);
  const unmapped = wrows.filter(w => !map[w.key]);
  const cmpRowsByDiv = {}; G.rows.forEach(r => (cmpRowsByDiv[r.division] || (cmpRowsByDiv[r.division] = [])).push(r));
  const ratio = (bad, n) => n ? `<b>${bad === 0 ? 'holds' : 'fails'}</b> in ${fmt(n - bad)} of ${fmt(n)}` : '–';
  const consT = `<table class="t"><thead><tr><th>Division</th><th class="num">Months filled in</th><th>END = START + IN − OUT</th><th>START = last month’s END</th><th>Typed TOTAL = sum of stations</th></tr></thead><tbody>
    ${cons.map(c => `<tr><td>${esc(c.div)}</td><td class="num">${c.populated}</td>
      <td>${c.id1n ? `<span class="chk ${c.id1 ? 'warn' : 'ok'}">${c.id1 ? ICON.warn : ICON.check}${c.id1 ? 'Fails in ' + c.id1 + ' of ' + c.id1n : 'Holds in all ' + c.id1n}</span>` : '–'}</td>
      <td>${c.id2n ? `<span class="chk ${c.id2 ? 'warn' : 'ok'}">${c.id2 ? ICON.warn : ICON.check}${c.id2 ? 'Fails in ' + c.id2 + ' of ' + c.id2n : 'Holds in all ' + c.id2n}</span>` : '–'}</td>
      <td>${c.tN ? `<span class="chk ${c.tBad ? 'warn' : 'ok'}">${c.tBad ? ICON.warn : ICON.check}${c.tBad ? 'Differs in ' + c.tBad + ' of ' + c.tN : 'Matches in all ' + c.tN}</span>` : '–'}</td></tr>`).join('')}</tbody></table>`;
  const mapT = `<table class="t"><thead><tr><th>Workbook row</th><th>Compared with</th></tr></thead><tbody>
    ${wrows.map(w => `<tr><td><span class="muted">${esc(w.division)}</span> ${esc(w.label)}</td><td><label class="sr" for="mm-${esc(w.key)}">Computed row for ${esc(w.label)}</label>
      <select id="mm-${esc(w.key)}" data-mpmap="${esc(w.key)}"><option value="">Not compared</option>${Object.keys(cmpRowsByDiv).map(d => `<optgroup label="${esc(d)}">${cmpRowsByDiv[d].map(r => `<option value="${esc(r.key)}"${map[w.key] === r.key ? ' selected' : ''}>${esc(r.station)}</option>`).join('')}</optgroup>`).join('')}</select></td></tr>`).join('')}</tbody></table>`;
  const f = S.files.find(x => S.mp && x.id === S.mp.fileId);
  return `<div class="stack">
    <div class="panel"><div class="panel-h"><h3>How the workbook agrees with itself</h3><span class="small muted">${esc(f ? f.name : '')}</span></div>
      <div class="tbl-wrap">${consT}</div>
      <div class="panel-foot small muted">Checked on the sum of each division’s station rows, month by month, over the months the workbook fills in. The computed grid above holds both identities by construction.</div></div>
    <div class="panel"><div class="panel-h"><h3>Station mapping</h3><span class="small muted">${unmapped.length ? plural(unmapped.length, 'workbook row') + ' not compared' : 'Every workbook row is compared'}</span></div>
      <details class="mapd"${unmapped.length ? ' open' : ''}><summary>Which workbook row is compared with which computed row</summary><div class="tbl-wrap">${mapT}</div></details>
      <div class="panel-foot small muted">Matched by name after dropping the division from the label (“AIRPORTS LCA” → LCA). Change any pairing here; several workbook rows can point at one computed row and are added together.</div></div>
  </div>`;
}

function trustPanel(md, G) {
  const rec = md.recovery || { hires: {}, exits: {} };
  const unp = md.unplaced || [];
  const byYear = {}; unp.filter(u => u.sheet === 'exits' && u.date != null).forEach(u => { const y = C.dayParts(u.date)[0]; byYear[y] = (byYear[y] || 0) + 1; });
  const years = Object.keys(byYear).sort();
  const unpH = unp.filter(u => u.sheet === 'hires').length, unpE = unp.filter(u => u.sheet === 'exits').length;
  const fix = recordsToFix(md);
  const firstM = G.months[0].key;
  const recent = unp.filter(u => u.sheet === 'exits' && u.date != null && u.date >= md.W0).length;
  return `<div class="panel"><div class="panel-h"><h3>How far to trust this</h3><button class="btn sm" data-act="mp-fix-csv" ${fix.length ? '' : 'disabled'}>Download records to fix</button></div>
    <div class="panel-b trust">
      <div>
        <p>The employee code and Α.Κ.Α. are the only things that tie a row to a person. A hire with no matching departure leaves that person on the books from then on, and every later month inherits the error. So the grid <b>overstates headcount, and more so the further back it goes</b>.
        ${years.length ? `Unplaced departures by year: ${years.map(y => `${y} <b>${byYear[y]}</b>`).join(', ')}.
          ${recent ? `${recent === 1 ? 'The one' : 'The ' + fmt(recent)} since ${esc(mlabel(firstM))} each leave${recent === 1 ? 's' : ''} someone counted as still employed from that date on, so months after them may be high by up to ${fmt(recent)}.` : `None fall inside the window, so the grid can be read at face value.`}
          Older ones mostly belong to people now left out as probable unfiled departures.` : 'No departure rows are unplaced, so the grid can be read at face value across the window.'}</p>
        <p class="small muted" style="margin-top:10px">Filling in the Α.Κ.Α. or Α/Μ on the rows listed below, then loading the workbook again, fixes it.</p>
      </div>
      <dl class="facts">
        <dt>Rows without Α.Κ.Α. placed by name</dt><dd>${fmt((rec.hires.recovered || 0) + (rec.exits.recovered || 0))} <span class="muted">(${fmt(rec.hires.recovered || 0)} hires, ${fmt(rec.exits.recovered || 0)} departures)</span></dd>
        <dt>Rows still unplaced</dt><dd>${fmt(unp.length)} <span class="muted">(${fmt(unpH)} hires, ${fmt(unpE)} departures)</span></dd>
        <dt>Probable unfiled departures, left out</dt><dd>${fmt(md.ghosts)}</dd>
        <dt>On payroll with no HR record, can’t be placed</dt><dd>${fmt(md.noHR)}</dd>
      </dl>
    </div>
    ${fix.length ? `<details class="fixd"><summary>Records to fix (${fmt(fix.length)})</summary><div class="tbl-wrap fix-wrap"><table class="t">
      <thead><tr><th>What</th><th>Employee</th><th>Α.Κ.Α.</th><th>Where</th><th>Date</th><th>What to do</th></tr></thead>
      <tbody>${fix.map(f => `<tr><td>${esc(f.type)}</td><td>${f.p ? personCell(f.p) : `<span class="pn">${esc(f.name || '(no name)')}</span><div class="pc">${f.codes ? `<span class="code hr">${esc(f.codes)}</span>` : ''}</div>`}</td><td>${esc(f.aka || '–')}</td><td>${esc(f.where || '–')}</td><td>${fmtD(f.date)}</td><td class="small">${esc(f.detail)}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
    <div class="panel-foot small muted">Probable unfiled departures: people not on payroll, not recorded as leaving, with nothing on record since before ${esc(mlabel(firstM))}. They are left out of the grid rather than counted as still working.</div></div>`;
}

function csvManpower() {
  const md = MD(), G = mpCompute(md), v = S.mpv, keys = G.months.map(m => m.key);
  const i0 = keys.indexOf(v.from), i1 = keys.indexOf(v.to), idx = []; for (let i = i0; i <= i1; i++) idx.push(i);
  const rows = G.rows.filter(r => (!v.div || r.division === v.div) && idx.some(i => { const c = r.cells[i]; return c.start || c.end || c.joined || c.left || c.movedIn || c.movedOut; }));
  const wrows = wbRows(), map = S.mp ? wbMapping(wrows, G.rows) : {};
  const val = (r, i) => { const c = figOf(r.cells[i], v.fig); if (v.mode === 'computed' || !r.key) return c; const w = wbValue(wrows, map, r.key, v.fig, G.months[i].key); return v.mode === 'workbook' ? (w ?? '') : (w == null ? '' : c - w); };
  const data = [];
  const divs = [...new Set(rows.map(r => r.division))];
  for (const d of divs) {
    const rs = rows.filter(r => r.division === d);
    rs.forEach(r => data.push([d, r.station, ...idx.map(i => val(r, i))]));
    if (v.mode === 'computed') data.push([d, 'TOTAL', ...idx.map(i => figOf(sumCells(rs.map(r => r.cells[i])), v.fig))]);
  }
  if (v.mode === 'computed') data.push(['ALL', 'TOTAL', ...idx.map(i => figOf(sumCells(rows.map(r => r.cells[i])), v.fig))]);
  downloadCSV('manpower-' + v.fig + '-' + v.mode + '-' + v.from + '-to-' + v.to + '.csv', ['Division', 'Station', ...idx.map(i => keys[i])], data);
}
function csvFix() {
  const fix = recordsToFix(MD());
  downloadCSV('records-to-fix-' + MD().year + '.csv', ['What', 'Name', 'Codes', 'Α.Κ.Α.', 'Where', 'Date', 'What to do'],
    fix.map(f => [f.type, f.name || '', f.codes || '', f.aka || '', f.where || '', f.date == null ? '' : C.dayISO(f.date), f.detail]));
}

document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('select[data-mp]')) { S.mpv[t.dataset.mp] = t.value; render(); }
  else if (t.matches('select[data-mpmap]')) { S.mpMap[t.dataset.mpmap] = t.value; render(); }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act^="mp-"]');
  if (!t || !S.model) return;
  const a = t.dataset.act;
  if (a === 'mp-fig') { S.mpv.fig = t.dataset.v; render(); }
  else if (a === 'mp-mode') { S.mpv.mode = t.dataset.v; render(); }
  else if (a === 'mp-csv') csvManpower();
  else if (a === 'mp-fix-csv') csvFix();
});

/* ==========================================================================
   leavers.js — one tab: who left in each month, with their average monthly
   hours and their hours in every payroll month. Inserted into views.js.
   ========================================================================== */

function leaversByMonth() {
  const md = MD(), y = md.year, asOf = md.asOf;
  const y0 = C.dayOf(y, 1, 1), yEnd = Math.min(C.dayOf(y, 12, 31), asOf);
  const per = md.period.Both;
  const [ay, am] = C.dayParts(asOf);
  const lastM = y < ay ? 12 : y > ay ? 0 : am;
  const byM = {};
  for (const p of md.people) {
    const h = p.hr; if (!h) continue;
    for (const ev of h.events) {
      if (ev.code !== 'x' || ev.d < y0 || ev.d > yEnd) continue;
      const m = C.dayParts(ev.d)[1];
      const x = calc(p, 'Both', '');
      (byM[m] || (byM[m] = [])).push({ p, ev, m, x, s: summarise(x, per, 'worked') });
    }
  }
  for (const m in byM) byM[m].sort((a, b) => a.ev.d - b.ev.d || a.p.name.localeCompare(b.p.name));
  const months = []; for (let m = 1; m <= lastM; m++) months.push(m);
  return { md, per, months, byM, partial: y === ay ? lastM : 0 };
}

// Months picked in the chips; empty means every month (the default view)
function lvShown(L) {
  S.lvSel = (S.lvSel || []).filter(m => L.months.includes(m) && L.byM[m] && L.byM[m].length);
  return S.lvSel.length ? L.months.filter(m => S.lvSel.includes(m)) : L.months;
}
const joinMonths = ms => ms.map(m => C.MONTHS[m - 1]).reduce((a, b, i, arr) => i === 0 ? b : a + (i === arr.length - 1 ? ' and ' : ', ') + b, '');

function renderLeavers() {
  const L = leaversByMonth(), { md, per, months, byM } = L;
  if (!months.length) return head('Leavers', '') + emptyState('Nothing to show for ' + md.year, 'This tab covers the year set on the Files tab, up to today.');
  const total = months.reduce((s, m) => s + (byM[m] ? byM[m].length : 0), 0);
  const shown = lvShown(L), picked = S.lvSel.length > 0;
  const shownN = shown.reduce((s, m) => s + (byM[m] ? byM[m].length : 0), 0);
  const nav = `<div class="lv-bar"><nav class="lv-nav" aria-label="Choose months">
      <button class="lv-chip lv-all" data-act="lv-all" aria-pressed="${!picked}"><b>All months</b><span>${total}</span></button>
      ${months.map(m => {
        const n = byM[m] ? byM[m].length : 0, on = S.lvSel.includes(m);
        return `<button class="lv-chip${n ? '' : ' none'}" data-act="lv-pick" data-m="${m}" aria-pressed="${on}" ${n ? '' : 'disabled title="Nobody left"'}><b>${C.MON[m - 1]}</b><span>${n}</span></button>`;
      }).join('')}
    </nav>
    <p class="lv-hint">${picked ? `Showing <b>${esc(joinMonths(shown))}</b>: ${plural(shownN, 'person', 'people')}. Click a month to add or remove it.` : 'Click a month to show only that month; click more to add them.'}</p></div>`;
  const cols = `<colgroup><col class="c-emp"><col class="c-day"><col class="c-avg">${per.map(() => '<col class="c-m">').join('')}</colgroup>`;
  const thead = m => `<thead><tr><th>Employee</th><th>Last day</th><th class="num">Avg / month</th>${per.map(k => `<th class="num${k === m ? ' lvm' : ''}">${C.MON[k - 1]}</th>`).join('')}</tr></thead>`;
  const sections = shown.map(m => {
    const list = byM[m] || [];
    const title = C.MONTHS[m - 1] + ' ' + md.year + (m === L.partial ? ' (to date)' : '');
    if (!list.length) return picked ? '' : `<section class="lv-sec lv-empty" id="lv-${m}"><h3>${esc(title)}</h3><span class="muted">Nobody left.</span></section>`;
    const noHours = list.filter(r => !r.s.total).length;
    const rows = list.map(r => `<tr><td>${personCell(r.p)}</td><td>${fmtD(r.ev.d)}</td>
      <td class="num"><b>${r.s.total ? fmt(r.s.avg, 1) : '–'}</b>${r.s.total ? `<div class="small muted">${r.s.worked} ${r.s.worked === 1 ? 'month' : 'months'}</div>` : ''}</td>
      ${per.map(k => `<td class="num${k === m ? ' lvm' : ''}">${r.x.m[k] ? fmtH(r.x.m[k]) : '<span class="muted">–</span>'}</td>`).join('')}</tr>`).join('');
    return `<section class="panel lv-sec" id="lv-${m}">
      <div class="panel-h"><h3>${esc(title)}</h3><span class="muted">${plural(list.length, 'person', 'people')} left${noHours ? `, ${noHours} with no payroll hours in these files` : ''}</span></div>
      <div class="tbl-wrap"><table class="t lv" style="--lv-n:${per.length}">${cols}${thead(m)}<tbody>${rows}</tbody></table></div></section>`;
  }).join('');
  return head('Leavers', `${plural(total, 'person', 'people')} left the group in ${md.year}${L.partial ? ', up to today' : ''}. The average is their total hours divided by the months they had hours; the highlighted column is the month they left. Moves to another group company are not counted.`,

}

function csvLeavers() {

  $('#tabs').innerHTML = views.map(v => `<button class="tab" role="tab" aria-selected="${S.view === v.id}" data-view="${v.id}">${v.label}${v.id === 'files' && issues ? '<span class="dot" title="Some files need attention"></span>' : ''}</button>`).join('');

function renderFiles() {
  if (S.busy) return `<div class="view-head"><div><h2>Reading your files</h2><p>Only the columns the tool needs are taken from each sheet.</p></div></div>${progressHTML()}`;
  const m = S.model || { payrollCount: 0, both: 0, hours: 0 };
  const cov = coverage();
  const pfCount = Object.keys(S.payroll).length;
  const range = cov.lo ? (cov.lo === cov.hi ? C.MONTHS[cov.lo - 1] : C.MON[cov.lo - 1] + '–' + C.MON[cov.hi - 1]) + ' ' + S.year : '';
  const summary = pfCount
    ? `${plural(m.payrollCount, 'person', 'people')} on payroll, ${fmt(m.both)} of them paid by both AS and BX. ${fmtH(m.hours)} hours across ${plural(pfCount, 'file')}, ${range}.` +
      (m.hasHR ? ` ${fmt(m.matched)} match an HR record and ${fmt(m.noHR)} don’t.` : '')
    : 'No payroll files have been read yet.';

  // table rows
  const order = f => f.kind === 'payroll' || f.kind === 'payroll-unnamed' ? (f.company === 'BX' ? 2 : 1) : f.kind === 'hr' ? 3 : f.kind === 'manpower' ? 4 : 5;
  const files = [...S.files].sort((a, b) => order(a) - order(b) || (a.month || 0) - (b.month || 0) || a.id - b.id);
  let last = 0;
  const rows = files.map(f => {
    const grp = order(f), sep = last && grp !== last ? ' sep' : ''; last = grp;
    const dim = f.status === 'replaced' ? ' dim' : '';
    let readAs = '', rowsTxt = '', parsed = '', totals = '', check = '';
    if (f.kind === 'payroll' && f.status !== 'pending') {
      const p = S.payroll[f.company + '-' + f.month];
      readAs = `<span class="co ${f.company.toLowerCase()}">${f.company}</span>${C.MONTHS[f.month - 1]}`;
      if (p && p.fileId === f.id) {
        rowsTxt = fmt(p.rows.length); parsed = fmtH(p.parsedHours);
        totals = p.totalsHours == null ? '–' : fmtH(p.totalsHours);
        const d = p.totalsHours == null ? null : p.parsedHours - p.totalsHours;
        check = d == null ? CH.none : Math.abs(d) < 0.01 ? CH.ok : `<span class="chk warn">${ICON.warn}${d > 0 ? '+' : ''}${fmtH(d)}</span>`;
      }
    } else if (f.status === 'pending') {
      readAs = '<span class="chk warn">' + ICON.warn + 'Needs month and company</span>';
    } else if (f.kind === 'hr') {
      readAs = '<span class="co hr">HR</span>Hirings & departures';
      if (S.hr && S.hr.fileId === f.id) rowsTxt = fmt(S.hr.stats.hireRows) + ' hires<br>' + fmt(S.hr.stats.exitRows) + ' departures';
      check = f.status === 'warn' ? `<span class="chk warn">${ICON.warn}Columns missing</span>` : `<span class="chk ok">${ICON.check}Read</span>`;
    } else if (f.kind === 'manpower') {
      readAs = '<span class="co mp">MP</span>Manpower report';
      if (S.mp && S.mp.fileId === f.id) rowsTxt = plural(S.mp.stations, 'station') + '<br>' + (S.mp.months.length ? S.mp.months[0] + ' to ' + S.mp.months[S.mp.months.length - 1] : 'no months');
      check = f.status === 'warn' ? `<span class="chk warn">${ICON.warn}No months</span>` : `<span class="chk ok">${ICON.check}Read</span>`;
    } else {
      readAs = '<span class="muted">Not recognised</span>';
    }
    if (f.status === 'error') check = `<span class="chk bad">${ICON.warn}Not read</span>`;
    if (f.status === 'replaced') check = '<span class="chk none">Replaced</span>';
    const note = f.note ? `<div class="small muted">${esc(f.note)}</div>` : '';
    return `<tr class="${sep}${dim}"><td><div class="fname">${esc(f.name)}</div>${note}</td><td>${readAs}</td><td class="num">${rowsTxt}</td><td class="num">${parsed}</td><td class="num">${totals}</td><td>${check}</td>
      <td><button class="btn ghost sm" data-act="remove" data-id="${f.id}" aria-label="Remove ${esc(f.name)}">${ICON.trash}</button></td></tr>`;
  }).join('');

    return `<div class="pending" data-pending="${f.id}">

  const pending = pendList.length ? `<div class="pending-group">

    </div>` : '';

  const warn = warnings();
  const notes = warn.length ? `<div class="notes">${warn.map(([lv, t]) => `<div class="note ${lv}">${lv === 'info' ? ICON.info : ICON.warn}<span>${esc(t)}</span></div>`).join('')}</div>` : `<div class="note">${ICON.check}<span>Every month has both companies and every file matches its Totals row.</span></div>`;

  const hr = S.hr ? `<div class="panel"><div class="panel-h"><h3>Hirings & departures</h3></div><div class="panel-b">

      <div class="sub-h">ΠΑΡΑΙΤΗΣΕΙΣ ΚΑΙ ΜΕΤΑΦΟΡΕΣ</div>
      <dl class="facts"><dt>Departure and transfer rows</dt><dd>${fmt(S.hr.stats.exitRows)}</dd><dt>Without Α.Κ.Α.</dt><dd>${fmt(S.hr.stats.exitNoAka)}</dd><dt>Excel zero dates skipped</dt><dd>${fmt(S.hr.stats.exitZeroDate)}</dd>${S.hr.stats.exitTextDate ? `<dt>Text dates ignored</dt><dd>${fmt(S.hr.stats.exitTextDate)}</dd>` : ''}</dl>
      ${m.recovery ? `<div class="sub-h">Rows without Α.Κ.Α., matched by name</div>
      <dl class="facts"><dt>Hires placed</dt><dd>${fmt(m.recovery.hires.recovered)}</dd><dt>Departures placed</dt><dd>${fmt(m.recovery.exits.recovered)}</dd>
        <dt>Name not found elsewhere</dt><dd>${fmt(m.recovery.hires.unknown + m.recovery.exits.unknown)}</dd>
        <dt>Name shared by several people</dt><dd>${fmt(m.recovery.hires.ambiguous + m.recovery.exits.ambiguous)}</dd>
        <dt>No name</dt><dd>${fmt(m.recovery.hires.nameless + m.recovery.exits.nameless)}</dd></dl>

  else if (a === 'resolve') {
    const id = +t.dataset.id, m = +$('#pm-' + id).value, c = $('#pc-' + id).value;
    if (!m || !c) { (m ? $('#pc-' + id) : $('#pm-' + id)).focus(); return; }
    resolvePending(id, m, c);
  }
  else if (a === 'resolve-all') resolveAll();
});
function toggleClear(force) {
  const box = $('#clear-confirm'), btn = $('[data-act="clear"]');
  if (!box) return;
  const open = force == null ? box.classList.contains('hide') : force;
  box.classList.toggle('hide', !open);
  btn.setAttribute('aria-expanded', open);
  if (open) $('[data-act="clear-yes"]', box).focus(); else btn.focus();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#clear-confirm') && !$('#clear-confirm').classList.contains('hide')) toggleClear(false); });
document.addEventListener('pointerdown', e => {
  const box = $('#clear-confirm');
  if (box && !box.classList.contains('hide') && !e.target.closest('.clear-wrap')) { box.classList.add('hide'); $('[data-act="clear"]').setAttribute('aria-expanded', false); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'year2') { const y = +e.target.value; if (y >= 2000 && y <= 2100) { S.year = y; rebuild(); } }
});

let dragDepth = 0;
window.addEventListener('dragenter', e => { if ([...(e.dataTransfer.types || [])].includes('Files')) { dragDepth++; document.body.classList.add('dragging'); } });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const d = $('#drop'); if (d) d.classList.remove('over');
  const fs = [...(e.dataTransfer.files || [])];
  if (fs.length) ingest(fs);
});

applyTheme();
showUpload();
})();

</script>
